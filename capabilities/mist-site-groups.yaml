naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Juniper Mist API — Site Groups
  description: 'Juniper Networks Juniper Mist API — Site Groups. 2 operations. Lead operation: Juniper Networks List site
    groups. Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - Site Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
  consumes:
  - type: http
    namespace: mist-site-groups
    baseUri: https://api.mist.com/api/v1
    description: Juniper Networks Juniper Mist API — Site Groups business capability. Self-contained, no shared references.
    resources:
    - name: orgs-org_id-sitegroups
      path: /orgs/{org_id}/sitegroups
      operations:
      - name: listsitegroups
        method: GET
        description: Juniper Networks List site groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsitegroup
        method: POST
        description: Juniper Networks Create a site group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.JUNIPER_API_KEY}}'
  exposes:
  - type: rest
    namespace: mist-site-groups-rest
    port: 8080
    description: REST adapter for Juniper Networks Juniper Mist API — Site Groups. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/orgs/{org-id}/sitegroups
      name: orgs-org-id-sitegroups
      description: REST surface for orgs-org_id-sitegroups.
      operations:
      - method: GET
        name: listsitegroups
        description: Juniper Networks List site groups
        call: mist-site-groups.listsitegroups
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsitegroup
        description: Juniper Networks Create a site group
        call: mist-site-groups.createsitegroup
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mist-site-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Juniper Mist API — Site Groups. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: juniper-networks-list-site-groups
      description: Juniper Networks List site groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mist-site-groups.listsitegroups
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-create-site-group
      description: Juniper Networks Create a site group
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: mist-site-groups.createsitegroup
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
