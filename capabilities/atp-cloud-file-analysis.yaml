naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — File Analysis
  description: 'Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — File Analysis. 3 operations. Lead operation:
    Juniper Networks List file submissions. Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - File Analysis
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
  consumes:
  - type: http
    namespace: atp-cloud-file-analysis
    baseUri: https://{atp_server}/api/v1
    description: Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — File Analysis business capability.
      Self-contained, no shared references.
    resources:
    - name: file-analysis-submissions
      path: /file-analysis/submissions
      operations:
      - name: listsubmissions
        method: GET
        description: Juniper Networks List file submissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by analysis status
        - name: start_date
          in: query
          type: string
        - name: end_date
          in: query
          type: string
        - name: limit
          in: query
          type: integer
    - name: file-analysis-submissions-submission_id
      path: /file-analysis/submissions/{submission_id}
      operations:
      - name: getsubmissionstatus
        method: GET
        description: Juniper Networks Get file analysis status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: submission_id
          in: path
          type: string
          required: true
    - name: file-analysis-submit
      path: /file-analysis/submit
      operations:
      - name: submitfile
        method: POST
        description: Juniper Networks Submit file for analysis
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.JUNIPER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: atp-cloud-file-analysis-rest
    port: 8080
    description: REST adapter for Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — File Analysis. One
      Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/file-analysis/submissions
      name: file-analysis-submissions
      description: REST surface for file-analysis-submissions.
      operations:
      - method: GET
        name: listsubmissions
        description: Juniper Networks List file submissions
        call: atp-cloud-file-analysis.listsubmissions
        with:
          status: rest.status
          start_date: rest.start_date
          end_date: rest.end_date
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/file-analysis/submissions/{submission-id}
      name: file-analysis-submissions-submission-id
      description: REST surface for file-analysis-submissions-submission_id.
      operations:
      - method: GET
        name: getsubmissionstatus
        description: Juniper Networks Get file analysis status
        call: atp-cloud-file-analysis.getsubmissionstatus
        with:
          submission_id: rest.submission_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/file-analysis/submit
      name: file-analysis-submit
      description: REST surface for file-analysis-submit.
      operations:
      - method: POST
        name: submitfile
        description: Juniper Networks Submit file for analysis
        call: atp-cloud-file-analysis.submitfile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: atp-cloud-file-analysis-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — File Analysis. One
      tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: juniper-networks-list-file-submissions
      description: Juniper Networks List file submissions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: atp-cloud-file-analysis.listsubmissions
      with:
        status: tools.status
        start_date: tools.start_date
        end_date: tools.end_date
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-get-file-analysis
      description: Juniper Networks Get file analysis status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: atp-cloud-file-analysis.getsubmissionstatus
      with:
        submission_id: tools.submission_id
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-submit-file-analysis
      description: Juniper Networks Submit file for analysis
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: atp-cloud-file-analysis.submitfile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
