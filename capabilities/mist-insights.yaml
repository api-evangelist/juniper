naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Juniper Mist API — Insights
  description: 'Juniper Networks Juniper Mist API — Insights. 1 operations. Lead operation: Juniper Networks Get site AI insights.
    Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - Insights
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
  consumes:
  - type: http
    namespace: mist-insights
    baseUri: https://api.mist.com/api/v1
    description: Juniper Networks Juniper Mist API — Insights business capability. Self-contained, no shared references.
    resources:
    - name: sites-site_id-insights-stats
      path: /sites/{site_id}/insights/stats
      operations:
      - name: getsiteinsights
        method: GET
        description: Juniper Networks Get site AI insights
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: metric
          in: query
          type: string
          description: Specific insight metric to retrieve
    authentication:
      type: bearer
      token: '{{env.JUNIPER_API_KEY}}'
  exposes:
  - type: rest
    namespace: mist-insights-rest
    port: 8080
    description: REST adapter for Juniper Networks Juniper Mist API — Insights. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/sites/{site-id}/insights/stats
      name: sites-site-id-insights-stats
      description: REST surface for sites-site_id-insights-stats.
      operations:
      - method: GET
        name: getsiteinsights
        description: Juniper Networks Get site AI insights
        call: mist-insights.getsiteinsights
        with:
          metric: rest.metric
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mist-insights-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Juniper Mist API — Insights. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: juniper-networks-get-site-ai
      description: Juniper Networks Get site AI insights
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mist-insights.getsiteinsights
      with:
        metric: tools.metric
      outputParameters:
      - type: object
        mapping: $.
