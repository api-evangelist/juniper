  - type: http
    namespace: apstra-connectivity-templates
    baseUri: https://{apstra_server}/api
    description: Juniper Networks Juniper Apstra API — Connectivity Templates business capability. Self-contained, no shared
      references.
    resources:
    - name: blueprints-blueprint_id-connectivity-templates
      path: /blueprints/{blueprint_id}/connectivity-templates
      operations:
      - name: listconnectivitytemplates
        method: GET
        description: Juniper Networks List connectivity templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: AuthToken
      value: '{{env.JUNIPER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: apstra-connectivity-templates-rest
    port: 8080
    description: REST adapter for Juniper Networks Juniper Apstra API — Connectivity Templates. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/blueprints/{blueprint-id}/connectivity-templates
      name: blueprints-blueprint-id-connectivity-templates
      description: REST surface for blueprints-blueprint_id-connectivity-templates.
      operations:
      - method: GET
        name: listconnectivitytemplates
        description: Juniper Networks List connectivity templates
        call: apstra-connectivity-templates.listconnectivitytemplates
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apstra-connectivity-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Juniper Apstra API — Connectivity Templates. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: juniper-networks-list-connectivity-templates
      description: Juniper Networks List connectivity templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apstra-connectivity-templates.listconnectivitytemplates
      outputParameters:
      - type: object
        mapping: $.
