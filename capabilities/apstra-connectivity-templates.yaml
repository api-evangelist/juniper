naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Juniper Apstra API — Connectivity Templates
  description: 'Juniper Networks Juniper Apstra API — Connectivity Templates. 1 operations. Lead operation: Juniper Networks
    List connectivity templates. Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - Connectivity Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
