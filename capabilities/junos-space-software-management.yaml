naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Junos Space Network Management Platform API — Software Management
  description: 'Juniper Networks Junos Space Network Management Platform API — Software Management. 2 operations. Lead operation:
    Juniper Networks List software packages. Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - Software Management
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
  consumes:
  - type: http
    namespace: junos-space-software-management
    baseUri: https://{space_server}/api/space
    description: Juniper Networks Junos Space Network Management Platform API — Software Management business capability. Self-contained,
      no shared references.
    resources:
    - name: software-management-packages
      path: /software-management/packages
      operations:
      - name: listsoftwarepackages
        method: GET
        description: Juniper Networks List software packages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: software-management-packages-deploy
      path: /software-management/packages/deploy
      operations:
      - name: deploysoftware
        method: POST
        description: Juniper Networks Deploy software to devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.JUNIPER_USER}}'
      password: '{{env.JUNIPER_PASS}}'
  exposes:
  - type: rest
    namespace: junos-space-software-management-rest
    port: 8080
    description: REST adapter for Juniper Networks Junos Space Network Management Platform API — Software Management. One
      Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/software-management/packages
      name: software-management-packages
      description: REST surface for software-management-packages.
      operations:
      - method: GET
        name: listsoftwarepackages
        description: Juniper Networks List software packages
        call: junos-space-software-management.listsoftwarepackages
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/software-management/packages/deploy
      name: software-management-packages-deploy
      description: REST surface for software-management-packages-deploy.
      operations:
      - method: POST
        name: deploysoftware
        description: Juniper Networks Deploy software to devices
        call: junos-space-software-management.deploysoftware
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: junos-space-software-management-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Junos Space Network Management Platform API — Software Management. One tool
      per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: juniper-networks-list-software-packages
      description: Juniper Networks List software packages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: junos-space-software-management.listsoftwarepackages
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-deploy-software-devices
      description: Juniper Networks Deploy software to devices
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: junos-space-software-management.deploysoftware
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
