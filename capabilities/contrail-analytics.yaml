naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Juniper Contrail Networking API — Analytics
  description: 'Juniper Networks Juniper Contrail Networking API — Analytics. 3 operations. Lead operation: Juniper Networks
    Get virtual network analytics. Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - Analytics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
  consumes:
  - type: http
    namespace: contrail-analytics
    baseUri: https://{contrail_controller}:8082
    description: Juniper Networks Juniper Contrail Networking API — Analytics business capability. Self-contained, no shared
      references.
    resources:
    - name: analytics-uves-virtual-network-vn_fqname
      path: /analytics/uves/virtual-network/{vn_fqname}
      operations:
      - name: getvirtualnetworkanalytics
        method: GET
        description: Juniper Networks Get virtual network analytics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vn_fqname
          in: path
          type: string
          description: Fully qualified name of the virtual network
          required: true
    - name: analytics-uves-virtual-networks
      path: /analytics/uves/virtual-networks
      operations:
      - name: listvirtualnetworkanalytics
        method: GET
        description: Juniper Networks List virtual network analytics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: analytics-uves-vrouters
      path: /analytics/uves/vrouters
      operations:
      - name: listvrouteranalytics
        method: GET
        description: Juniper Networks List vRouter analytics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.JUNIPER_API_KEY}}'
  exposes:
  - type: rest
    namespace: contrail-analytics-rest
    port: 8080
    description: REST adapter for Juniper Networks Juniper Contrail Networking API — Analytics. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/analytics/uves/virtual-network/{vn-fqname}
      name: analytics-uves-virtual-network-vn-fqname
      description: REST surface for analytics-uves-virtual-network-vn_fqname.
      operations:
      - method: GET
        name: getvirtualnetworkanalytics
        description: Juniper Networks Get virtual network analytics
        call: contrail-analytics.getvirtualnetworkanalytics
        with:
          vn_fqname: rest.vn_fqname
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/analytics/uves/virtual-networks
      name: analytics-uves-virtual-networks
      description: REST surface for analytics-uves-virtual-networks.
      operations:
      - method: GET
        name: listvirtualnetworkanalytics
        description: Juniper Networks List virtual network analytics
        call: contrail-analytics.listvirtualnetworkanalytics
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/analytics/uves/vrouters
      name: analytics-uves-vrouters
      description: REST surface for analytics-uves-vrouters.
      operations:
      - method: GET
        name: listvrouteranalytics
        description: Juniper Networks List vRouter analytics
        call: contrail-analytics.listvrouteranalytics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: contrail-analytics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Juniper Contrail Networking API — Analytics. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: juniper-networks-get-virtual-network
      description: Juniper Networks Get virtual network analytics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: contrail-analytics.getvirtualnetworkanalytics
      with:
        vn_fqname: tools.vn_fqname
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-list-virtual-network
      description: Juniper Networks List virtual network analytics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: contrail-analytics.listvirtualnetworkanalytics
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-list-vrouter-analytics
      description: Juniper Networks List vRouter analytics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: contrail-analytics.listvrouteranalytics
      outputParameters:
      - type: object
        mapping: $.
