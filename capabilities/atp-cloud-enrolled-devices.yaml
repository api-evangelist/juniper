naftiko: 1.0.0-alpha2
info:
  label: Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — Enrolled Devices
  description: 'Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — Enrolled Devices. 2 operations. Lead
    operation: Juniper Networks List enrolled devices. Self-contained Naftiko capability covering one Juniper business surface.'
  tags:
  - Juniper
  - Enrolled Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    JUNIPER_API_KEY: JUNIPER_API_KEY
capability:
  consumes:
  - type: http
    namespace: atp-cloud-enrolled-devices
    baseUri: https://{atp_server}/api/v1
    description: Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — Enrolled Devices business capability.
      Self-contained, no shared references.
    resources:
    - name: enrolled-devices
      path: /enrolled-devices
      operations:
      - name: listenrolleddevices
        method: GET
        description: Juniper Networks List enrolled devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: enrolled-devices-device_id
      path: /enrolled-devices/{device_id}
      operations:
      - name: getenrolleddevice
        method: GET
        description: Juniper Networks Get enrolled device details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: device_id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.JUNIPER_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: atp-cloud-enrolled-devices-rest
    port: 8080
    description: REST adapter for Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — Enrolled Devices.
      One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/enrolled-devices
      name: enrolled-devices
      description: REST surface for enrolled-devices.
      operations:
      - method: GET
        name: listenrolleddevices
        description: Juniper Networks List enrolled devices
        call: atp-cloud-enrolled-devices.listenrolleddevices
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/enrolled-devices/{device-id}
      name: enrolled-devices-device-id
      description: REST surface for enrolled-devices-device_id.
      operations:
      - method: GET
        name: getenrolleddevice
        description: Juniper Networks Get enrolled device details
        call: atp-cloud-enrolled-devices.getenrolleddevice
        with:
          device_id: rest.device_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: atp-cloud-enrolled-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud API — Enrolled Devices. One
      tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: juniper-networks-list-enrolled-devices
      description: Juniper Networks List enrolled devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: atp-cloud-enrolled-devices.listenrolleddevices
      outputParameters:
      - type: object
        mapping: $.
    - name: juniper-networks-get-enrolled-device
      description: Juniper Networks Get enrolled device details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: atp-cloud-enrolled-devices.getenrolleddevice
      with:
        device_id: tools.device_id
      outputParameters:
      - type: object
        mapping: $.
