name: Junos Telemetry Interface (JTI) Protocol Buffers
provider: Juniper Networks
providerId: juniper
description: >-
  First-party Protocol Buffer (proto2/proto3) definitions for the Junos Telemetry
  Interface — the streaming-telemetry contract a Junos or Junos EVO device uses to
  push sensor data to a collector over gRPC (gNMI/gRPC dial-out and dial-in) and UDP.
  Juniper publishes one complete proto set per Junos release in the Juniper/telemetry
  repository; the files captured here are the 25.4R1 (Junos) set, copied verbatim.
release: 25.4R1
release_date_note: >-
  Directory 25.4 is the most recent release directory in the repository as of 2026-09-18.
  Juniper also ships a parallel 25.4R1-EVO set (187 protos) for Junos EVO platforms,
  not captured here.
upstream:
  repository: https://github.com/Juniper/telemetry
  path: 25.4/25.4R1/protos/junos-telemetry-interface
  also_available: >-
    Juniper distributes the same files from the support download site as
    "JUNOS Telemetry Interface Data Model Files" per release
    (https://www.juniper.net/support/downloads).
  reference_copy: https://github.com/Juniper/TelemetryInterface
file_count: 170
transport:
  - name: gRPC (gNMI)
    note: >-
      GnmiJuniperTelemetryHeader.proto / GnmiJuniperTelemetryHeaderExtension.proto carry
      the Juniper header extension attached to gNMI SubscribeResponse notifications.
  - name: gRPC native sensor (dial-in / dial-out)
    note: telemetry_top.proto defines TelemetryStream, the outer envelope for native-sensor export.
  - name: UDP
    note: The same proto payloads are used for the legacy UDP export path.
notes:
