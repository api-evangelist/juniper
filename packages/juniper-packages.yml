provider: Juniper Networks
providerId: juniper
summary: >-
  Juniper does not ship a single "Juniper SDK". It ships a device-automation family
  (Junos PyEZ, JSNAPy, jxmlease, the Ansible collections) that speaks NETCONF to Junos
  boxes, plus infrastructure-as-code providers for the two cloud control planes
  (Mist and Apstra). There is NO first-party client library for the Mist REST API
  itself in any registry — the 1,059-operation Mist API is consumed through Terraform,
  the mobile location SDKs, or raw HTTP.
