  name: Juniper Networks Orgs RF Templates API
  description: >-
    Rf Templates are a feature in Juniper Mist wireless assurance that allow for uniform radio configurations
    to be applied across all sites in an organization.


    These templates can be customized to include model-specific exceptions and settings for different
    use cases.


    RF Templates enable the management of radio bands, channel width, transmission power, and ap antenna
    gain.


