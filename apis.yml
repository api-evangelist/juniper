- aid: juniper:juniper-orgs-integration-skyatp-api
  name: Juniper Networks Orgs Integration SkyATP API
  description: "Sky Advanced Threat Prevention (Sky ATP) is a cloud-based security designed to detect\
    \ and mitigate advanced threats in real-time, ensuring the security and integrity of your network.\
    \  \nThe integration of Sky ATP with Mist is a strategic move to enhance the security posture of wireless\
    \ networks by leveraging the capabilities of both solutions.\n\n\nThe integration of Sky ATP with\
    \ Mist enhances the security of wireless networks by providing real-time threat alerts and mitigation\
    \ capabilities. Here are the key benefits of this integration:\n\n* Enhanced Security: Adds another\
    \ layer of security to the robust mechanisms already in place within the Mist WLAN platform. It leverages\
    \ artificial intelligence (AI) for tighter security, lower operational costs, and optimized user experience.\n\
    * Real-Time Threat Detection: Quickly identifies devices on the network that are infected with malware\
    \ and takes appropriate actions. This ensures that security risks are assessed and mitigated promptly\
    \ when users and devices are connected to wireless networks.\n* Improved Device Tracking: Allows for\
    \ better tracking of client hosts as Mist supplies client MAC addresses to Juniper ATP Cloud. This\
    \ information is crucial for identifying and mitigating threats.\n* Streamlined Security Events: Threat\
    \ alerts detected by Juniper SRX Series Firewalls and ATP Cloud are automatically streamed to Mist,\
    \ enabling administrators to quickly assess security risks and take appropriate actions such as quarantine\
    \ or enforce security policies."
