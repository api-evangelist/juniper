- aid: juniper:juniper-orgs-advanced-anti-malware-profiles-api
  name: Juniper Networks Orgs Advanced Anti Malware Profiles API
  description: >-
    The "Advanced Anti-Malware" feature in Sky ATP is a comprehensive security solution that leverages
    multiple techniques to detect and prevent malware attacks. Here are the key components of this feature:

    * **Flow-Based Antivirus Policy**: The policy checks inbound and outbound traffic to stop malware,
    quarantine infected systems, prevent data exfiltration, and disrupt lateral movement.

    * **Machine Learning-Based Threat Detection**: Sky ATP uses machine learning to identify zero-day
    threats and detect malware that traditional antivirus software might miss.

    * **Integration with SRX Series Firewalls**: The SRX Series firewalls integrate with Sky ATP to block
    known malicious file downloads and outbound Command and Control (C&C) traffic. This integration ensures
    that malware is quickly identified and dropped before it can infect a host.

    * **Real-Time Threat Intelligence**: Sky ATP distributes third-party threat intelligence feeds to
    all ATP-subscribed SRX firewalls for immediate action, reducing the attack surface.


    These components collectively provide a robust and automated threat detection and remediation solution,
    simplifying cybersecurity infrastructure and processes for organizations.


    For more details, you can refer to the Juniper documentation on advanced anti-malware policy configuration.
  humanURL: https://www.juniper.net/documentation/product/us/en/junos-pyez/
  baseURL: netconf://[device-ip]:830
