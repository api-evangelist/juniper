- aid: juniper:juniper-sites-maps-auto-placement-api
  name: Juniper Networks Sites Maps - Auto-placement API
  description: "### AP Auto-Placement\nAP Auto-Placement is a feature in Juniper Mist wireless assurance\
    \ that automatically determines and sets the positions of Access Points (APs) on a floorplan.\n\n\
    It saves time and simplifies the deployment process by eliminating the need for manual placement.\
    \ \n\nThe autoplacement algorithm calculates the most probable location for each AP based on factors\
    \ such as signal strength and coverage requirements. \n\nThe confidence level of the autoplacement\
    \ is indicated by colors, with green representing high certainty, orange indicating medium certainty,\
    \ and red suggesting low certainty. \nIn cases where aps are isolated or cannot communicate with nearby\
    \ aps, they cannot be placed automatically and must be [manually positioned on the floorplan]($e/Sites%20Devices/updateSiteDevice).\
    \ \n\nAfter the autoplacement process is complete, the results can be evaluated and accepted of rejected\
    \ with the API Call [Confirm Site AP Localization Data]($e/Sites%20Maps%20-%20Auto-placement/confirmSiteApLocalizationData)\n\
    \n\n### AP Auto-Orientation\nAp Auto-Orientation is a feature in juniper mist wireless assurance that\
    \ allows users to check and correct the orientation of Access Points (APs) on a floorplan. \n\nThis\
    \ feature is supported by specific ap models and requires a firmware dependency of version 0.14.28310\
    \ or higher and does not require a maintenance window and can be used after performing autoplacement.\
    \ \n\nTo use auto-orientation, physically install the APs, claim or adopt them into the Juniper Mist\
    \ organization, place them on the floorplan, and perform auto-placement, then trigger the [Start Site\
    \ Ap Auto Orientation API call]($e/Sites%20Maps%20-%20Auto-placement/startSiteApAutoOrientation)\n\
    \nAfter 24 hours, the rotation in degrees of the AP(s) will be updated. users can accept or deny the\
    \ changes made by the auto-orientation feature with the API Call [Confirm Site AP Localization Data]($e/Sites%20Maps%20-%20Auto-placement/confirmSiteApLocalizationData)."
  humanURL: https://www.juniper.net/documentation/product/us/en/junos-pyez/
  baseURL: netconf://[device-ip]:830
  tags:
  - Sites Maps - Auto-placement
  properties:
  - type: OpenAPI
    url: openapi/juniper-sites-maps-auto-placement-api-openapi.yml
  - type: GitHub
    url: https://github.com/mistsys/mist_openapi
  - type: APIReference
    url: >-
      https://www.juniper.net/documentation/us/en/software/mist/api/http/guides/overview/overview
