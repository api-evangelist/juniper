- aid: juniper:juniper-orgs-idp-profiles-api
  name: Juniper Networks Orgs IDP Profiles API
  description: >-
    An IDP profile is a set of predefined rules and actions that determine how the Intrusion Detection
    and Prevention (IDP) system handles network traffic.


    It allows you to selectively enforce attack detection and prevention techniques on your network. The
    profile includes a set of IDP signatures and rules recommended by Juniper Networks, and each attack
    type and severity has a specific action associated with it, such as closing the TCP connection, dropping
    the packet, or sending an alert.


    The IDP profile can be applied to an application policy to monitor and analyze network events for
    signs of incidents, violations, or threats to security policies.
