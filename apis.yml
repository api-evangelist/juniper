  description: >-
    NAC User MACs (Endpoints) provide a database of endpoints identified by their MAC addresses. They
    can be used assign each endpoint with various attributes, such as name, VLAN, role and client label.
    Once an endpoint is labeled, the label name can be used to create [NAC Tags]($h/Orgs%20NAC%20Tags/_overview)
    as match criteria.


    [NAC Tags]($h/Orgs%20NAC%20Tags/_overview) can be used to create Tags regrouping one or multiple endpoint
    MAC addresses, but the use of the User MACs provides additional features:

    * possibility to assign specific attributes, like a Name, a RADIUS Group, a VLAN ID, ...

    * possibility to assign one or multiple Tags (Labels) to a User MAC

    * improved management for large list of MAC addresses
