    \ to get it:\n  * in JSON response, more usable for developers. Simply don\\'t specify the `forward`\
    \ parameter when obtaining the authorization URL\n  * as GET parameter, for UI where the user flow\
    \ can be continued. Specify the landing page/url of your choice \n3. Obtain the authorization code\
    \ by clicking / going through Authorization URL Link Mist Account against OAuth2 Provider by using\
