- aid: juniper:juniper-orgs-nac-portals-api
  name: Juniper Networks Orgs NAC Portals API
  description: "NAC Portals are for onboard Wireless and Wired client with 802.1X\n\nThe NAC Portal is\
    \ a web-based interface that allows users to authenticate and\ngain access to the network. It is typically\
    \ used for guest access or for devices\nthat do not have a pre-configured certificate for 802.1X authentication.\n\
    \nIt can also be used to provision certificates for devices that require them with the Mist Application.\n\
    \n\n### NAC-Based External Guest Portal Authorization / How to implement a External Guest Portal\n\
    \n#### Context\n\nIn the guest portal flow, context such as SSID, guest MAC, AP MAC is required to\
    \ unique identify the guest, if it's already authorized (e.g. roam to another AP), and used to instruct\
    \ the AP to stop redirecting/blocking the user traffic\n\n#### Redirect\n\nGuest Device (or CNA in\
    \ MacOS/iOS term) will be redirected to, e.g. “?ap_mac=5c5b35001234&ssid=Guest&…”\n\n| Name | Type\
    \ | Description |\n |------|------|-------------|\n | ap_mac | string | AP's MAC address |\n | site_id\
    \ | string | Site ID |\n | device_mac | string | Device's MAC address (the device that blocks the\
    \ traffic) |\n | ssid | string | for wireless |\n | port_name | string | for wired (e.g. eth0, ge-0/0/13)\
    \ |\n | client_mac | string | Client's MAC address |\n \n\n#### Authorize\n\nOnce the guest has gone\
    \ through your portal flow, authorize them by redirect the user to\n\n```\nGET https://url_generated_by_portal_authorize_url?jwt=<signature>\n\
    ```\n\nThis can be generated by\n\n```python\nimport jwt\n\nsecret = \"EIfPMOykI3lMlDdNPub2WcbqT6dNOtWwmYHAd6bY\"\
    \  # from portal_authorize_jwt_secret above \npayload = {\n    # for wireless\n    \"ap_mac\": \"\
    5c5b35001234\",\n    \"wlan_id\": \"be22bba7-8e22-e1cf-5185-b880816fe2cf\",  # only for _wireless_\
    \ captive portal\n    \"client_mac\": \"d58f6bb4c9d8\",\n\n    # for wired\n    \"device_mac\": \"\
    5c5b35001234\",\n    \"port_name\": \"eth0\",  # only for _wired_ captive portal\"\n    \"client_mac\"\
    : \"d58f6bb4c9d8\",\n\n    # common\n    # how long should we authorize this session\n    \"minutes\"\
    : 480,  \n    \"expires\": 1768587994,  # alternatively\n    # instead of the original URL the user\
    \ is trying to go to, redirect the user to this URL    \n    \"forward\": \"http://www.mist.com\"\
    ,\n    # for testing: if authorize_only=true and authorization is successful, 200 OK will be returned\
    \ instead of 302 Redirect the user to the `forward` URL\n    \"authorize_only\": False\n}\n\nencoded_jwt\
    \ = jwt.encode(payload, secret, algorithm='HS256')\n```"
  humanURL: https://www.juniper.net/documentation/product/us/en/junos-pyez/
