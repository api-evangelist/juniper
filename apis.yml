- aid: juniper:juniper-junos-telemetry-interface
  name: Junos Telemetry Interface (JTI)
  description: Streaming telemetry from Junos and Junos EVO devices to a collector over gRPC (gNMI and native 
    sensors) or UDP. The contract is a per-release set of Protocol Buffer definitions that Juniper publishes 
    on GitHub and on its support download site; 170 protos from the 25.4R1 set are captured verbatim in grpc/.
  humanURL: https://www.juniper.net/documentation/product/us/en/junos-telemetry-interface/
  baseURL: grpc://device:32767
  tags:
  - Networking
  - Telemetry
  - gRPC
  - Protobuf
  - Observability
  - Junos
  x-product: Junos
  properties:
  - type: Protobuf
    url: grpc/_index.yml
    name: JTI Protocol Buffers (25.4R1, 170 files)
  - type: GitHub
    url: https://github.com/Juniper/telemetry
    name: Juniper/telemetry — all releases
  - type: Documentation
    url: https://www.juniper.net/documentation/product/us/en/junos-telemetry-interface/
