- aid: juniper:juniper-sites-psks-api
  name: Juniper Networks Sites Psks API
  description: >-
    A multi PSK (Pre-Shared Key) is a feature that allows the use of multiple PSKs for securing network
    connections.


    It provides a simple and comprehensive way to onboard client devices without relying on client MAC
    addresses.


    Each psk has its own key name, which can be used for user-level accountability, key rotation, and
    visibility in the management platform. It supports the creation, rotation, and auto-expiration of
    psks, and allows vlan assignment and role assignment for dynamic per-user policies.


    Multi PSKs create virtual broadcast domains and can be used for end-user onboarding via authenticated
    sso login.


    Mist supports two methods of Site PSKs lookup: * local * radius
  humanURL: https://www.juniper.net/documentation/product/us/en/junos-pyez/
