- aid: juniper:juniper-orgs-integration-cradlepoint-api
  name: Juniper Networks Orgs Integration Cradlepoint API
  description: >-
    The integration between Mist and Cradlepoint allows users to utilize Cradlepoint 5G cellular adapters
    with Juniper's wired, wireless, and SD-WAN solutions driven by Mist AI.


    With this integration, users can manage Cradlepoint devices from the Mist portal, including onboarding,
    assigning devices to a site, and viewing device inventory details. It also provides visibility into
    the health, SLE, and insights of Cradlepoint devices.


    Additionally, the integration enables users to leverage Marvis, Juniper's virtual network assistant,
    to receive proactive recommendations and self-driving network actions. This integration enhances the
    client-to-cloud user experience by providing insights into branch WAN adapters, helping network admins
    reduce Mean Time to Identify (MTTI).
