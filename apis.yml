- aid: juniper:juniper-sites-mxedges-api
  name: Juniper Networks Sites MxEdges API
  description: >-
    MxEdges (Mist Edges) at the site level are deployed to tunnel traffic at each site due to network
    constraints or security concerns.


    They can be assigned to a specific site and configured to provide tunneling and RADIUS proxy services
    for the access points (APs) in that site.


    These Mist Edges allow for the extension of user vlans from the corporate network to the aps, and
    they support features such as auto preemption for failover, dual tunneling to different mist edge
    clusters, and anchor tunnels for traffic routing to dmz areas.
