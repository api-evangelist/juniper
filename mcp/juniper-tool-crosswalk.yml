summary: >-
  THE CROSSWALK IS EMPTY, AND THAT IS THE FINDING. Juniper's MCP tools and Juniper's
  published REST contract address two different machines. junos-mcp-server drives a
  Junos device over NETCONF; the 1,059-operation Mist API drives the Mist cloud over
  HTTPS. Not one MCP tool binds to a Mist operationId, and not one Mist operation is
  reachable from an MCP tool. An agent given the Junos MCP server cannot touch the
  cloud platform Juniper sells, and an agent given the Mist API has no MCP front door.
