description: >-
  JUNIPER PUBLISHES NO PLANS AND NO PRICES. There is no public pricing page, no per-call
  rate card and no self-serve tier for any Juniper API. API access is bundled into the
  subscription or licence for the underlying product (Mist cloud services, Apstra,
  Paragon/Routing Director, Junos Space) and is quoted through sales or a partner. Since
  the HPE acquisition the buying path itself has moved: juniper.net/us/en/how-to-buy.html
  now 301s to hpe.com.
note: >-
  plan_count is 0 on purpose. A previous round of this artifact listed one synthetic
  "Product Subscription" plan with price "included with product subscription", which reads
  to a scorer as a published plan. Juniper published no such plan; the entry was ours.
