summary: >-
  JUNIPER NO LONGER OPERATES ITS OWN TRUST CENTER. The former
  juniper.net/us/en/company/trust-center.html now 301s cross-domain to HPE's Digital
  Trust Center, and trust.juniper.net does not resolve. No Juniper-hosted page listing
  Juniper's own certifications was found, so no Compliance or TrustCenter pointer is
  emitted — crediting Juniper with HPE's certification page would be crediting a company
  with a document it does not serve.
