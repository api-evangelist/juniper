generated: '2026-09-18'
method: derived
source: >-
  openapi/juniper-mist-api-openapi.yml (Mist API 2607.1.1, the provider's own OpenAPI 3.1
  export) + https://www.juniper.net/documentation/us/en/software/mist/automation-integration/topics/concept/webhooks.html
provider: Juniper Networks
providerId: juniper
api: Mist API
summary: >-
  Juniper Mist ships a real, well-specified webhook surface: 30 named topics, each with
  its own delivery-envelope and event schema in the published OpenAPI, five delivery
  transports, HMAC request signing, and a delivery-results search API you can query
  after the fact. There is NO AsyncAPI document — Juniper does not publish one — so this
  artifact is the webhook catalog, derived from the provider's own contract, and the
  apis.yml pointer is `Webhooks`, not `AsyncAPI`.
asyncapi:
  published: false
  note: >-
    Searched the Juniper and mistsys GitHub organizations, the Mist API Reference portal
    export formats (only postman20/openapi31json/openapi31yaml are offered) and the
    documentation site. No AsyncAPI document exists. A previous round of this repo carried
    an apis.yml pointer to asyncapi/juniper-networks-junos-telemetry-asyncapi.yml, a file
    that was never written and a document Juniper has never published; that pointer was
    removed on 2026-09-18. The real Junos telemetry contract is Protocol Buffers, captured
    in grpc/ — not AsyncAPI.
management:
  scopes:
    - level: org
      collection: /api/v1/orgs/{org_id}/webhooks
    - level: site
      collection: /api/v1/sites/{site_id}/webhooks
  operations:
    - POST /api/v1/orgs/{org_id}/webhooks
    - GET /api/v1/orgs/{org_id}/webhooks
    - GET|PUT|DELETE /api/v1/orgs/{org_id}/webhooks/{webhook_id}
    - POST /api/v1/orgs/{org_id}/webhooks/{webhook_id}/ping
    - GET /api/v1/orgs/{org_id}/webhooks/{webhook_id}/events/search
    - GET /api/v1/orgs/{org_id}/webhooks/{webhook_id}/events/count
    - POST /api/v1/sites/{site_id}/webhooks
    - GET /api/v1/sites/{site_id}/webhooks
    - GET|PUT|DELETE /api/v1/sites/{site_id}/webhooks/{webhook_id}
    - POST /api/v1/sites/{site_id}/webhooks/{webhook_id}/ping
    - GET /api/v1/sites/{site_id}/webhooks/{webhook_id}/events/search
    - GET /api/v1/sites/{site_id}/webhooks/{webhook_id}/events/count
    - GET /api/v1/const/webhook_topics
  discovery: >-
    GET /api/v1/const/webhook_topics returns the live topic list with per-topic flags
    (for_org, internal, has_delivery_results, allows_single_event_per_message) — a
    machine-readable event catalog served by the API itself.
delivery:
  transports:
    - http-post
    - oauth2
    - aws-sns
    - google-pubsub
    - splunk
  batching: >-
    Multiple events arrive in one message by default. single_event_per_message=true
    forces one event per message, and is only available on topics whose
    allows_single_event_per_message flag is set.
  custom_headers: >-
    http-post webhooks accept arbitrary request headers (name+value strings,
    under 1000 bytes total).
  tls_verification: verify_cert defaults to true for https destinations.
security:
  signing:
    mechanism: HMAC over the raw request body, using a shared secret set on the webhook
    headers:
      - name: X-Mist-Signature-v2
        algorithm: HMAC_SHA256
      - name: X-Mist-Signature
        algorithm: HMAC_SHA1
        note: legacy; prefer v2
    applies_to: type=http-post webhooks that set `secret`
    source: components.schemas.webhook.properties.secret in the published OpenAPI
  oauth2_delivery: >-
    type=oauth2 webhooks fetch a bearer token from oauth2_token_url before delivering,
    supporting client_credentials and password grants with optional oauth2_scopes.
observability:
  delivery_results: >-
    Topics with has_delivery_results expose /events/search and /events/count, returning
    webhook_delivery records. The published webhook_delivery_topic enum limits this to
    alarms, audits, device-updowns, occupancy-alerts and ping.
  ping: A POST /ping on any webhook triggers a test delivery.
topic_count: 30
