          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
                description: Property key is the IoT port name (e.g. "A1"), value is the output state (0 or 1).
                examples:
                - A1: 1
                  DO: 0
                contentMediaType: application/json
              examples:
