                    - 79
                    avg_cellular_rssi:
                    - -95
                    - -92
                    avg_cpu:
                    - 12.5
                    - 15.2
                    avg_memory:
                    - 43.1
                    - 44.8
                    avg_wifi_rssi:
                    - -62
                    - -60
                    end: 1717113600
                    interval: 3600
                    limit: 100
                    page: 1
                    rt:
                    - 2026-05-30 16:00:00+00:00
                    - 2026-05-30 17:00:00+00:00
                    start: 1717027200
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    avg_battery:
                    - 82
                    - 79
                    avg_cellular_rssi:
                    - -95
                    - -92
                    avg_cpu:
                    - 12.5
                    - 15.2
                    avg_memory:
                    - 43.1
                    - 44.8
                    avg_wifi_rssi:
                    - -62
                    - -60
                    end: 1717113600
                    interval: 3600
                    limit: 100
                    page: 1
                    rt:
                    - 2026-05-30 16:00:00+00:00
                    - 2026-05-30 17:00:00+00:00
                    start: 1717027200
