openapi: 3.2.0
info:
  title: Juniper Networks Juniper Contrail Networking Security Groups API
  description: Juniper Contrail (now Cloud-Native Contrail Networking) provides an SDN controller with a RESTful API for managing virtual networks, network policies, security groups, and service chaining. The API server runs on port 8082 and provides CRUD operations on networking objects. It supports multi-tenancy through project-based resource isolation and integrates with OpenStack, Kubernetes, and VMware orchestrators.
  version: 5.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/contrail-networking/
    email: support@juniper.net
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{contrail_controller}:8082
  description: Contrail API Server
  variables:
    contrail_controller:
      default: contrail.example.com
      description: Hostname or IP of the Contrail controller
security:
- keystoneAuth: []
tags:
- name: Security Groups
  description: Security group and firewall rule management
paths:
  /security-groups:
    get:
      operationId: listSecurityGroups
      summary: Juniper Networks List security groups
      description: Returns all security groups.
      tags:
      - Security Groups
      parameters:
      - $ref: '#/components/parameters/ParentId'
      - $ref: '#/components/parameters/DetailParam'
      responses:
        '200':
          description: List of security groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  security-groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceRef'
    post:
      operationId: createSecurityGroup
      summary: Juniper Networks Create security group
      description: Creates a new security group with access control rules.
      tags:
      - Security Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                security-group:
                  $ref: '#/components/schemas/SecurityGroup'
      responses:
        '200':
          description: Security group created
components:
  schemas:
    SecurityGroup:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        display_name:
          type: string
        security_group_entries:
          type: object
          properties:
            policy_rule:
              type: array
              items:
                type: object
                properties:
                  direction:
                    type: string
                  protocol:
                    type: string
                  ethertype:
                    type: string
                    enum:
                    - IPv4
                    - IPv6
                  src_addresses:
                    type: array
                    items:
                      type: object
                  dst_addresses:
                    type: array
                    items:
                      type: object
                  src_ports:
                    type: array
                    items:
                      type: object
                  dst_ports:
                    type: array
                    items:
                      type: object
    ResourceRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        href:
          type: string
          format: uri
  parameters:
    ParentId:
      name: parent_id
      in: query
      description: Filter by parent resource UUID
      schema:
        type: string
        format: uuid
    DetailParam:
      name: detail
      in: query
      description: Return full object details instead of references
      schema:
        type: boolean
        default: false
  securitySchemes:
    keystoneAuth:
      type: http
      scheme: bearer
      description: Keystone token authentication. Obtain a token from the Keystone identity service and pass it as X-Auth-Token header.
externalDocs:
  description: Contrail API Documentation
  url: https://www.juniper.net/documentation/us/en/software/contrail/
