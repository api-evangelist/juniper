                    pic:
                      '0': ge*6, sfp*2
                    sub_required: wan1
                    type: gateway
                Switch:
                  value:
                  - alias: EX4100-48P-CHAS
                    defaults:
                      _ports: ge-0/0/0-47, et-0/1/0-3, xe-0/2/0-3, ge-0/2/0-3
