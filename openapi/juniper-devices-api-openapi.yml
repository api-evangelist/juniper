openapi: 3.2.0
info:
  title: Juniper Devices API
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
  version: '1.0'
  description: 'Operations tagged Devices across 2 of this provider''s published API definitions: juniper-junos-space-openapi.yml, juniper-mist-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{space_server}/api/space
  description: Junos Space Server
  variables:
    space_server:
      default: space.example.com
      description: Hostname or IP of the Junos Space server
- url: https://api.mist.com/api/v1
  description: Global Cloud (US)
- url: https://api.eu.mist.com/api/v1
  description: EU Cloud
- url: https://api.gc1.mist.com/api/v1
  description: GovCloud
tags:
- name: Devices
  description: Device discovery and management
paths:
  /device-management/devices:
    get:
      operationId: listDevices
      summary: Juniper Networks List managed devices
      description: Returns all devices managed by Junos Space.
      tags:
      - Devices
      parameters:
      - name: filter
        in: query
        description: Filter expression for devices
        schema:
          type: string
      - $ref: '#/components/parameters/PageStart'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of managed devices
          content:
            application/vnd.net.juniper.space.device-management.devices+json;version=2:
              schema:
                type: object
                properties:
                  devices:
                    type: object
                    properties:
                      device:
                        type: array
                        items:
                          $ref: '#/components/schemas/Device'
                      total:
                        type: integer
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: object
                    properties:
                      device:
                        type: array
                        items:
                          $ref: '#/components/schemas/Device'
      security:
      - basicAuth: []
    post:
      operationId: discoverDevice
      summary: Juniper Networks Discover a device
      description: Initiates device discovery to add a new device to Junos Space management.
      tags:
      - Devices
      requestBody:
        required: true
        content:
          application/vnd.net.juniper.space.device-management.discover-devices+json;version=2:
            schema:
              type: object
              required:
              - systemDiscoveryRule
              properties:
                systemDiscoveryRule:
                  type: object
                  properties:
                    ipAddressDiscoveryTarget:
                      type: object
                      properties:
                        ipAddress:
                          type: string
                    usePing:
                      type: boolean
                    manageDiscoveredSystemsFlag:
                      type: boolean
                    sshCredential:
                      type: object
                      properties:
                        userName:
                          type: string
                        password:
                          type: string
      responses:
        '202':
          description: Discovery job initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
      - basicAuth: []
    servers:
    - url: https://{space_server}/api/space
      description: Junos Space Server
      variables:
        space_server:
          default: space.example.com
          description: Hostname or IP of the Junos Space server
  /device-management/devices/{device_id}:
    get:
      operationId: getDevice
      summary: Juniper Networks Get device details
      description: Returns detailed information for a specific managed device.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Device not found
      security:
      - basicAuth: []
    delete:
      operationId: deleteDevice
      summary: Juniper Networks Delete managed device
      description: Removes a device from Junos Space management.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Device deleted
      security:
      - basicAuth: []
    servers:
    - url: https://{space_server}/api/space
      description: Junos Space Server
      variables:
        space_server:
          default: space.example.com
          description: Hostname or IP of the Junos Space server
  /sites/{site_id}/devices:
    get:
      operationId: listSiteDevices
      summary: Juniper Networks List site devices
      description: Returns all devices assigned to the specified site.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: type
        in: query
        description: Filter by device type
        schema:
          type: string
          enum:
          - ap
          - switch
          - gateway
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device_2'
      security:
      - apiToken: []
      - csrfToken: []
    servers:
    - url: https://api.mist.com/api/v1
      description: Global Cloud (US)
    - url: https://api.eu.mist.com/api/v1
      description: EU Cloud
    - url: https://api.gc1.mist.com/api/v1
      description: GovCloud
  /sites/{site_id}/devices/{device_id}:
    get:
      operationId: getSiteDevice
      summary: Juniper Networks Get device details
      description: Returns details for a specific device at a site.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/DeviceId_2'
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device_2'
      security:
      - apiToken: []
      - csrfToken: []
    put:
      operationId: updateSiteDevice
      summary: Juniper Networks Update device
      description: Updates configuration for a specific device.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/DeviceId_2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device_2'
      responses:
        '200':
          description: Device updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device_2'
      security:
      - apiToken: []
      - csrfToken: []
    delete:
      operationId: deleteSiteDevice
      summary: Juniper Networks Delete device
      description: Removes a device from the site.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/DeviceId_2'
      responses:
        '200':
          description: Device deleted
      security:
      - apiToken: []
      - csrfToken: []
    servers:
    - url: https://api.mist.com/api/v1
      description: Global Cloud (US)
    - url: https://api.eu.mist.com/api/v1
      description: EU Cloud
    - url: https://api.gc1.mist.com/api/v1
      description: GovCloud
  /sites/{site_id}/devices/stats:
    get:
      operationId: listSiteDeviceStats
      summary: Juniper Networks List site device statistics
      description: Returns statistics for all devices at a site.
      tags:
      - Devices
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: type
        in: query
        description: Filter by device type
        schema:
          type: string
          enum:
          - ap
          - switch
          - gateway
      responses:
        '200':
          description: Device statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceStats'
      security:
      - apiToken: []
      - csrfToken: []
    servers:
    - url: https://api.mist.com/api/v1
      description: Global Cloud (US)
    - url: https://api.eu.mist.com/api/v1
      description: EU Cloud
    - url: https://api.gc1.mist.com/api/v1
      description: GovCloud
components:
  parameters:
    PageStart:
      name: paging.start
      in: query
      description: Starting index for pagination
      schema:
        type: integer
        default: 0
    PageSize:
      name: paging.limit
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 25
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Device unique identifier
      schema:
        type: integer
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 100
        maximum: 1000
    SiteId:
      name: site_id
      in: path
      required: true
      description: Site unique identifier
      schema:
        type: string
        format: uuid
    DeviceId_2:
      name: device_id
      in: path
      required: true
      description: Device unique identifier
      schema:
        type: string
        format: uuid
  schemas:
    Device:
      type: object
      properties:
        '@key':
          type: integer
        deviceId:
          type: integer
        name:
          type: string
        ipAddr:
          type: string
        platform:
          type: string
          description: Device platform (e.g., SRX, MX, EX, QFX)
        serialNumber:
          type: string
        osVersion:
          type: string
        connectionStatus:
          type: string
          enum:
          - up
          - down
        managedStatus:
          type: string
          enum:
          - In Sync
          - Out Of Sync
          - Space Changed
          - Device Changed
        deviceFamily:
          type: string
        lastRebootTime:
          type: string
          format: date-time
    Job:
      type: object
      properties:
        jobId:
          type: integer
        name:
          type: string
        state:
          type: string
          enum:
          - INPROGRESS
          - SUCCESS
          - FAILURE
          - CANCELLED
        percentComplete:
          type: number
        createdTime:
          type: string
          format: date-time
        completedTime:
          type: string
          format: date-time
        summary:
          type: string
    Device_2:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - ap
          - switch
          - gateway
        model:
          type: string
        serial:
          type: string
        mac:
          type: string
          description: MAC address of the device
        ip:
          type: string
          description: IP address of the device
        map_id:
          type: string
          format: uuid
        x:
          type: number
          description: X position on the map
        y:
          type: number
          description: Y position on the map
        height:
          type: number
          description: Height of the device placement
        notes:
          type: string
        created_time:
          type: number
        modified_time:
          type: number
    DeviceStats:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mac:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
          - connected
          - disconnected
          - upgrading
          - restarting
        uptime:
          type: integer
          description: Device uptime in seconds
        last_seen:
          type: number
        num_clients:
          type: integer
        tx_bytes:
          type: integer
        rx_bytes:
          type: integer
        tx_pkts:
          type: integer
        rx_pkts:
          type: integer
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space user credentials
    apiToken:
      type: http
      scheme: bearer
      description: 'API token authentication. Obtain tokens from the Mist dashboard under Organization > Settings > API Token, or via the /self/apitokens endpoint. Pass as Authorization: Token <api-token>.'
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: CSRF token for session-based authentication.
x-refined-from:
- juniper-junos-space-openapi.yml
- juniper-mist-openapi.yml
