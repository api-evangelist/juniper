openapi: 3.2.0
info:
  title: Juniper Networks Juniper Contrail Networking Analytics API
  description: Juniper Contrail (now Cloud-Native Contrail Networking) provides an SDN controller with a RESTful API for managing virtual networks, network policies, security groups, and service chaining. The API server runs on port 8082 and provides CRUD operations on networking objects. It supports multi-tenancy through project-based resource isolation and integrates with OpenStack, Kubernetes, and VMware orchestrators.
  version: 5.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/contrail-networking/
    email: support@juniper.net
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{contrail_controller}:8082
  description: Contrail API Server
  variables:
    contrail_controller:
      default: contrail.example.com
      description: Hostname or IP of the Contrail controller
security:
- keystoneAuth: []
tags:
- name: Analytics
  description: Analytics and operational data
paths:
  /analytics/uves/virtual-networks:
    get:
      operationId: listVirtualNetworkAnalytics
      summary: Juniper Networks List virtual network analytics
      description: Returns UVE (User Visible Entity) analytics for all virtual networks.
      tags:
      - Analytics
      responses:
        '200':
          description: Virtual network analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    href:
                      type: string
  /analytics/uves/virtual-network/{vn_fqname}:
    get:
      operationId: getVirtualNetworkAnalytics
      summary: Juniper Networks Get virtual network analytics
      description: Returns detailed analytics for a specific virtual network.
      tags:
      - Analytics
      parameters:
      - name: vn_fqname
        in: path
        required: true
        description: Fully qualified name of the virtual network
        schema:
          type: string
      responses:
        '200':
          description: Virtual network analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VnUve'
  /analytics/uves/vrouters:
    get:
      operationId: listVrouterAnalytics
      summary: Juniper Networks List vRouter analytics
      description: Returns analytics for all vRouters (compute node agents).
      tags:
      - Analytics
      responses:
        '200':
          description: vRouter analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    href:
                      type: string
components:
  schemas:
    VnUve:
      type: object
      properties:
        UveVirtualNetworkAgent:
          type: object
          properties:
            in_tpkts:
              type: integer
            out_tpkts:
              type: integer
            in_bytes:
              type: integer
            out_bytes:
              type: integer
            virtualmachine_list:
              type: array
              items:
                type: string
            interface_list:
              type: array
              items:
                type: string
  securitySchemes:
    keystoneAuth:
      type: http
      scheme: bearer
      description: Keystone token authentication. Obtain a token from the Keystone identity service and pass it as X-Auth-Token header.
externalDocs:
  description: Contrail API Documentation
  url: https://www.juniper.net/documentation/us/en/software/contrail/
