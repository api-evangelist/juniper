security:
- apiToken: []
- csrfToken: []
tags:
- name: Sites Marvis Configs
  description: Marvis Config Actions are config changes injected by Marvis into network devices. These actions can be searched, counted, deleted, and given feedback.
paths:
  /api/v1/sites/{site_id}/marvis_configs/count:
    parameters: []
    get:
      tags:
      - Sites Marvis Configs
      summary: countSiteMarvisConfigActions
      description: Count Marvis Config Actions for a site by a distinct field.
      operationId: countSiteMarvisConfigActions
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: distinct
        in: query
        description: 'Field to count by. enum: `mac`, `type`, `src`, `admin_id`, `op`, `port_id`, `reason`, `vlan_ids`'
        style: form
        explode: true
        schema:
          type: string
          default: mac
      - name: mac
        in: query
        description: Filter by device MAC address
        style: form
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: Filter by config type (e.g. wired)
        style: form
        explode: true
        schema:
          type: string
      - name: src
        in: query
        description: Filter by source of the config action (e.g. marvis)
        style: form
        explode: true
        schema:
          type: string
      - name: admin_id
        in: query
        description: Filter by admin ID
        style: form
        explode: true
        schema:
          type: string
      - name: op
        in: query
        description: Filter by operation type (e.g. disable_port, enable_port, update_mtu, add_vlans_to_port)
        style: form
        explode: true
        schema:
          type: string
      - name: port_id
        in: query
        description: Filter by port identifier (e.g. ge-0/0/13)
        style: form
        explode: true
        schema:
          type: string
      - name: vlan_ids
        in: query
        description: Filter by VLAN ID
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: reason
        in: query
        description: Filter by reason for the config action (e.g. rogue_dhcp_server_detected)
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      responses:
        '200':
          description: Count result
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_count'
                - description: Distinct count response for time-bounded search results
                  examples:
                  - distinct: string
                    end: 0
                    limit: 0
                    results:
                    - count: 0
                      property: string
                    start: 0
                    total: 0
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    distinct: string
                    end: 0
                    limit: 0
                    results:
                    - count: 0
                      property: string
                    start: 0
                    total: 0
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_count'
                - description: Distinct count response for time-bounded search results
                  examples:
                  - distinct: string
                    end: 0
                    limit: 0
                    results:
                    - count: 0
                      property: string
                    start: 0
                    total: 0
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
                    distinct: string
                    end: 0
                    limit: 0
                    results:
                    - count: 0
                      property: string
                    start: 0
                    total: 0
        '400':
          description: Bad Syntax
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http400'
                - description: Standard HTTP 400 bad request error response
                  examples:
                  - detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http400'
                - description: Standard HTTP 400 bad request error response
                  examples:
                  - detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
