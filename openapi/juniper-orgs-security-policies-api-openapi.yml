      - '54'
      - 54b
      - '6'
      - 6b
      - '9'
      - 9b
      type: string
      description: 'enum: `1`, `11`, `11b`, `12`, `12b`, `18`, `18b`, `1b`, `2`, `24`, `24b`, `2b`, `36`, `36b`, `48`, `48b`, `5.5`, `5.5b`, `54`, `54b`, `6`, `6b`, `9`, `9b`'
    wlan_hotspot20_operators_item:
      title: wlan_hotspot20_operators_item
