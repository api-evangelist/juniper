      properties:
        circuit_id:
          type: string
          description: "Information to set in the `circuit_id` field of the DHCP Option 82. It is possible to use static string or the following variables (e.g. `{{SSID}}:{{AP_MAC}}`):\n  * {{AP_MAC}}\n  * {{AP_MAC_DASHED}}\n  * {{AP_MODEL}}\n  * {{AP_NAME}}\n  * {{SITE_NAME}}\n  * {{SSID}}"
          examples:
          - '{{SSID}}:{{AP_MAC}}'
        enabled:
          type: boolean
          description: Whether to inject option 82 when forwarding DHCP packets
          default: false
      description: DHCP Option 82 insertion settings for this WLAN
    wlan_apply_to2:
      title: wlan_apply_to2
      enum:
      - aps
      - site
      - wxtags
      type: string
      description: 'Scope that determines where this WLAN is applied. enum: `aps`, `site`, `wxtags`.'
    wlan_portal_sms_provider2:
      title: wlan_portal_sms_provider2
      enum:
      - broadnet
      - clickatell
      - gupshup
      - manual
      - puzzel
      - telstra
      - twilio
      - smsglobal
      type: string
      description: 'Optional if `sms_enabled`==`true`. SMS provider used to deliver guest portal access codes. enum: `broadnet`, `clickatell`, `gupshup`, `manual`, `puzzel`, `telstra`, `twilio`, `smsglobal`.'
      examples:
      - twilio
    coa_server:
      title: coa_server
      required:
      - ip
      - secret
      type: object
      properties:
        disable_event_timestamp_check:
          type: boolean
