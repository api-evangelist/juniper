tags:
- name: Orgs Security Policies
  description: 'Security Policy is designed to audit / catch discrepancies between

    "what''s intended to be running" versus "what''s actually running" in a network.


    Many big organizations have separated Security and IT team (for good reasons). Each site can be assigned a security policy.

    Whenever an AP is provisioned, the configuration will be checked against the security policy.

    Any violations will be flagged in Device Config History where you can search for the when and where the violation occurs.'
paths:
  /api/v1/orgs/{org_id}/secpolicies:
    parameters: []
    get:
      tags:
      - Orgs Security Policies
      summary: listOrgSecPolicies
      description: List organization security policies. Security policies define WLAN configuration baselines used to audit intended wireless settings against actual AP configuration.
      operationId: listOrgSecPolicies
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
