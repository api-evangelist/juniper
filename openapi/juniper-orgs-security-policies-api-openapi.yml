                description: Security policies returned by list operations
                examples:
                - - name: corporate only
                    wlans:
                    - auth:
                        pairwise:
                        - wpa1-tkip
                        - wpa2-tkip
                        type: psk
                      band: both
                      ssid: office
                    - auth:
                        type: open
                      band: '5'
                      ssid: office-guest
                contentMediaType: application/json
              examples:
                Example:
                  value:
                  - name: corporate only
                    wlans:
                    - auth:
                        pairwise:
                        - wpa1-tkip
                        - wpa2-tkip
                        type: psk
                      band: both
                      ssid: office
                    - auth:
                        type: open
                      band: '5'
                      ssid: office-guest
            application/vnd.api+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/secpolicy'
                description: Security policies returned by list operations
                examples:
                - - name: corporate only
                    wlans:
                    - auth:
                        pairwise:
