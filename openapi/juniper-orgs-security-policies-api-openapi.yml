    wlan_auth_owe2:
      title: wlan_auth_owe2
      enum:
      - disabled
      - enabled
      - required
      type: string
      description: 'When `type`==`open`, Opportunistic Wireless Encryption mode for this WLAN. enum: `disabled`, `enabled`, `required`.'
    wlan_roam_mode2:
      title: wlan_roam_mode2
      enum:
      - 11r
      - NONE
      - OKC
      type: string
