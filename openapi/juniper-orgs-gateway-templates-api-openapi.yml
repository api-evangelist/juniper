        ipsec_lifetime:
          type: integer
          description: If `provider`==`custom-ipsec`, IPsec lifetime configured for the custom tunnel
          contentEncoding: int32
        ipsec_proposals:
          type: array
          items:
            $ref: '#/components/schemas/tunnel_config_ipsec_proposal'
