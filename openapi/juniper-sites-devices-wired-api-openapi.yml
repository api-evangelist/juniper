    put:
      tags:
      - Sites Devices - Wired
      summary: updateSiteLocalSwitchPortConfig
      description: 'API Calls to add port config local overrides. This can be used by Switch Port Operators or Helpdesk administrators

        to change a Switch Port configuration without having to change the switch configuration.


        The local overrides configured for the switchports with `no_local_overwrite`==`true` won''t be applied to the switch configuration.


        > NOTE:

        >

        > When using the API Call, it is required to put send all overrides in the PUT request Payload, even the existing once.

        >

        > The current overrides can be retrieved with the API Call Get Site Device. The local overrides will show up separately from the `port_config` in the `local_port_config` so it can be easily identified (and cleared)'
      operationId: updateSiteLocalSwitchPortConfig
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: device_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      requestBody:
