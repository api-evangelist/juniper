            schema:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/junos_local_port_config'
              examples:
              - ge-0/0/0-1:
                  poe_disabled: true
                  usage: iot
              contentMediaType: application/json
            examples:
              Example:
                value:
                  ge-0/0/0-1:
                    poe_disabled: true
                    usage: iot
        required: false
      responses:
