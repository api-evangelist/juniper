openapi: 3.2.0
info:
  title: Juniper Networks Juniper Contrail Networking Service Instances API
  description: Juniper Contrail (now Cloud-Native Contrail Networking) provides an SDN controller with a RESTful API for managing virtual networks, network policies, security groups, and service chaining. The API server runs on port 8082 and provides CRUD operations on networking objects. It supports multi-tenancy through project-based resource isolation and integrates with OpenStack, Kubernetes, and VMware orchestrators.
  version: 5.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/contrail-networking/
    email: support@juniper.net
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{contrail_controller}:8082
  description: Contrail API Server
  variables:
    contrail_controller:
      default: contrail.example.com
      description: Hostname or IP of the Contrail controller
security:
- keystoneAuth: []
tags:
- name: Service Instances
  description: Service chaining and service instances
paths:
  /service-instances:
    get:
      operationId: listServiceInstances
      summary: Juniper Networks List service instances
      description: Returns all service instances for service chaining.
      tags:
      - Service Instances
      parameters:
      - $ref: '#/components/parameters/ParentId'
      - $ref: '#/components/parameters/DetailParam'
      responses:
        '200':
          description: List of service instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  service-instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceRef'
    post:
      operationId: createServiceInstance
      summary: Juniper Networks Create service instance
      description: Creates a new service instance for network service chaining.
      tags:
      - Service Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service-instance:
                  $ref: '#/components/schemas/ServiceInstance'
      responses:
        '200':
          description: Service instance created
components:
  parameters:
    ParentId:
      name: parent_id
      in: query
      description: Filter by parent resource UUID
      schema:
        type: string
        format: uuid
    DetailParam:
      name: detail
      in: query
      description: Return full object details instead of references
      schema:
        type: boolean
        default: false
  schemas:
    ResourceRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        href:
          type: string
          format: uri
    ServiceInstance:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        display_name:
          type: string
        service_instance_properties:
          type: object
          properties:
            interface_list:
              type: array
              items:
                type: object
                properties:
                  virtual_network:
                    type: string
            scale_out:
              type: object
              properties:
                max_instances:
                  type: integer
            ha_mode:
              type: string
              enum:
              - active-active
              - active-standby
        service_template_refs:
          type: array
          items:
            type: object
            properties:
              to:
                type: array
                items:
                  type: string
  securitySchemes:
    keystoneAuth:
      type: http
      scheme: bearer
      description: Keystone token authentication. Obtain a token from the Keystone identity service and pass it as X-Auth-Token header.
externalDocs:
  description: Contrail API Documentation
  url: https://www.juniper.net/documentation/us/en/software/contrail/
