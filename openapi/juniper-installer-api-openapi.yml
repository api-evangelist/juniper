          readOnly: true
        type:
          type:
          - string
          - 'null'
          description: Module type reported for the switch module
          readOnly: true
        uboot_version:
          type:
          - string
          - 'null'
          description: U-Boot firmware version reported for the switch module
          readOnly: true
        uptime:
