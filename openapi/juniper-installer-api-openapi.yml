      summary: claimInstallerDevices
      description: Claim devices into the organization inventory by activation code through the installer workflow.
      operationId: claimInstallerDevices
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      requestBody:
        description: Request Body
        content:
          application/json:
            schema:
              uniqueItems: true
              type: array
              items:
                type: string
              description: Request Body
              examples:
              - - 6JG8E-PTFV2-A9Z2N
                - DVH4V-SNMSZ-PDXBR
              contentMediaType: application/json
            examples:
              Example:
                value:
                - 6JG8E-PTFV2-A9Z2N
                - DVH4V-SNMSZ-PDXBR
        required: false
      responses:
        '200':
          description: OK - if any of entries are valid or there’s no errors
          headers: {}
