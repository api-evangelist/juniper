          readOnly: true
        power_cpld_version:
          type:
          - string
          - 'null'
          description: Power CPLD firmware version reported for the switch module
          readOnly: true
        psus:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/module_stat_item_psus_item'
