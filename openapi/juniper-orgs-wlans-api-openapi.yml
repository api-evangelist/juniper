          anyOf:
          - maximum: 999000
            minimum: 1
            type: integer
            contentEncoding: int32
          - type: string
          description: Downlink bandwidth limit applied to the whole WLAN
        wlan_limit_down_enabled:
          type: boolean
          description: If downlink limiting for whole wlan is enabled
          default: false
        wlan_limit_up:
          anyOf:
          - maximum: 999000
