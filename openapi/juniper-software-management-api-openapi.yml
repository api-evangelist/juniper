openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform Software Management API
  description: Junos Space Network Management Platform provides a RESTful API for centralized management of Juniper devices. The API supports device discovery, configuration management, software image deployment, script management, and audit logging. Resources are accessed via the /api/space namespace with XML or JSON media types.
  version: 23.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Server
  variables:
    space_server:
      default: space.example.com
      description: Hostname or IP of the Junos Space server
security:
- basicAuth: []
tags:
- name: Software Management
  description: Software image management and deployment
paths:
  /software-management/packages:
    get:
      operationId: listSoftwarePackages
      summary: Juniper Networks List software packages
      description: Returns all software packages (images) available in Junos Space.
      tags:
      - Software Management
      responses:
        '200':
          description: List of software packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: object
                    properties:
                      package:
                        type: array
                        items:
                          $ref: '#/components/schemas/SoftwarePackage'
  /software-management/packages/deploy:
    post:
      operationId: deploySoftware
      summary: Juniper Networks Deploy software to devices
      description: Deploys a software package to one or more managed devices.
      tags:
      - Software Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deployRequest:
                  type: object
                  properties:
                    packageId:
                      type: integer
                    deviceIds:
                      type: array
                      items:
                        type: integer
                    reboot:
                      type: boolean
                    validate:
                      type: boolean
      responses:
        '202':
          description: Deployment job initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
components:
  schemas:
    SoftwarePackage:
      type: object
      properties:
        packageId:
          type: integer
        fileName:
          type: string
        platform:
          type: string
        version:
          type: string
        size:
          type: integer
          description: Package size in bytes
        uploadDate:
          type: string
          format: date-time
    Job:
      type: object
      properties:
        jobId:
          type: integer
        name:
          type: string
        state:
          type: string
          enum:
          - INPROGRESS
          - SUCCESS
          - FAILURE
          - CANCELLED
        percentComplete:
          type: number
        createdTime:
          type: string
          format: date-time
        completedTime:
          type: string
          format: date-time
        summary:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space user credentials
externalDocs:
  description: Junos Space REST API Documentation
  url: https://www.juniper.net/documentation/us/en/software/junos-space/
