  /api/v1/orgs/{org_id}/jsi/inventory/search:
    parameters: []
    get:
      tags:
      - Orgs JSI
      summary: searchOrgJsiAssetsAndContracts
      description: 'This gets all devices purchased from the accounts associated with the Org

        * Fetch Install base devices for all linked accounts and associated account of the linked accounts.

        * The primary and the associated account ids will be queries from SFDC by passing the linked account

        * Returns only the device centric details of the Install base device. No customer specific information will be returned.'
      operationId: searchOrgJsiAssetsAndContracts
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: claimed
        in: query
        description: Device claim status, `true` for claimed devices, `false` for all devices. Accepts multiple comma-separated boolean values.
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - 'true'
        examples:
          Untitled Example2:
            value: true
      - name: model
        in: query
        description: Filter results by device model. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - QFX10000-36Q,QFX10000-30C
          - AP43
        examples:
          Untitled Example1:
            value: QFX10000-36Q,QFX10000-30C
          Untitled Example2:
            value: AP43
      - name: serial
        in: query
        description: Filter results by device serial number. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - ACNP4666,ACNP6969
          - FXLH2015150025
        examples:
          Untitled Example1:
            value: ACNP4666,ACNP6969
          Untitled Example2:
            value: FXLH2015150025
      - name: sku
        in: query
        description: Filter results by SKU. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - QFX10000-36Q,QFX10000-30C
          - EX2300
        examples:
          Untitled Example1:
            value: QFX10000-36Q,QFX10000-30C
          Untitled Example2:
            value: EX2300
      - name: status
        in: query
        description: 'Device status. enum: `all`, `connected`, `disconnected`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/device_status'
          - description: 'Device status. enum: `all`, `connected`, `disconnected`'
      - name: warranty_type
        in: query
        description: Device warranty type used to filter Juniper Support Insight inventory
        style: form
        explode: true
        schema:
          type: string
      - name: end_of_sale_after
        in: query
        description: Filter devices with End Of Sale date after this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2024-01-01
      - name: end_of_sale_before
        in: query
        description: Filter devices with End Of Sale date before this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2025-12-31
      - name: eos_after
        in: query
        description: Filter devices with End Of Support date after this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2024-01-01
      - name: eos_before
        in: query
        description: Filter devices with End Of Support date before this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2025-12-31
      - name: version_eos_after
        in: query
        description: Filter devices with OS Version End Of Support date after this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2024-01-01
      - name: version_eos_before
        in: query
        description: Filter devices with OS Version End Of Support date before this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2025-12-31
      - name: contract_end_before
        in: query
        description: Filter results by service contract end date before this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2025-12-31
      - name: contract_end_after
        in: query
        description: Filter results by service contract end date after this date
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 2024-01-01
      - name: contract_type
        in: query
        description: Filter results by contract type
        style: form
        explode: true
        schema:
          type: string
      - name: contract_sku
        in: query
        description: Filter results by contract SKU
        style: form
        explode: true
        schema:
          type: string
      - name: end_of_service_time
        in: query
        description: Filter results by end of service time
        style: form
        explode: true
        schema:
          type: string
      - name: support_contract_status
        in: query
        description: Filter results by service contract status
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/support_contract_status'
          - description: Filter results by service contract status
      - name: has_support
        in: query
        description: Indicates if the device is covered under active support contract. Accepts multiple comma-separated boolean values.
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - 'true'
        examples:
          Untitled Example2:
            value: true
      - name: sirt_id
        in: query
        description: To get the onboarded devices that are affected by the SIRT ID
        style: form
        explode: true
        schema:
          type: string
          examples:
          - JSA12345
      - name: pbn_id
