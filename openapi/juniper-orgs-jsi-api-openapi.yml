  /api/v1/orgs/{org_id}/jsi/inventory:
    parameters: []
    get:
      tags:
      - Orgs JSI
      summary: listOrgJsiPastPurchases
      description: 'This gets all devices purchased from the accounts associated with the Org

        * Fetch Install base devices for all linked accounts and associated account of the linked accounts.

        * The primary and the associated account ids will be queries from SFDC by passing the linked account

        * Returns only the device centric details of the Install base device. No customer specific information will be returned.'
      operationId: listOrgJsiPastPurchases
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
      - name: model
        in: query
        description: Filter results by one or more device models. Supports comma-separated values
        style: form
        explode: true
        schema:
          type: string
          examples:
          - AP43
      - name: serial
        in: query
        description: Filter results by device serial number
        style: form
        explode: true
        schema:
          type: string
          examples:
          - FXLH2015150025
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/js_inventory_item'
                description: JSI inventory items returned for an organization
                examples:
                - - device_name: name1
                    end_of_sale_time: 1561507200
                    eos_time: 1672012800
                    master: true
                    model: EX2300-24MP
