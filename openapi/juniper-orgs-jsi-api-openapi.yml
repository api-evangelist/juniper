openapi: 3.2.0
info:
  title: Mist Orgs JSI API
  description: '> Version: **2607.1.1**

    >

    > Date: **August 17, 2026**


    NOTE:

    Some important API changes will be introduced.'
  contact:
    name: Thomas Munzer
    email: tmunzer@juniper.net
  version: 2607.1.1
servers:
- url: https://api.mist.com
  variables: {}
- url: https://api.gc1.mist.com
  variables: {}
- url: https://api.ac2.mist.com
  variables: {}
- url: https://api.gc2.mist.com
  variables: {}
- url: https://api.gc4.mist.com
  variables: {}
- url: https://api.eu.mist.com
  variables: {}
- url: https://api.gc3.mist.com
  variables: {}
- url: https://api.ac6.mist.com
  variables: {}
- url: https://api.gc6.mist.com
  variables: {}
- url: https://api.ac5.mist.com
  variables: {}
- url: https://api.gc5.mist.com
  variables: {}
- url: https://api.gc7.mist.com
  variables: {}
security:
- apiToken: []
- csrfToken: []
tags:
- name: Orgs JSI
  description: 'Juniper Support Insight is a free service provided to all Mist customers.

    You can adopt your devices via a few lines CLI commands. Allowing you to

    * get some basic information about the adopted devices

    * web shell into device (write privilege required) \n* upgrade (write privilege required)'
paths:
  /api/v1/orgs/{org_id}/jsi/devices:
    parameters: []
    get:
      tags:
      - Orgs JSI
      summary: listOrgJsiDevices
      description: List organization devices connected to Juniper Support Insights (JSI), optionally filtered by model, serial number, or MAC address.
      operationId: listOrgJsiDevices
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
      - name: model
        in: query
        description: Filter results by device model
        style: form
        explode: true
        schema:
          type: string
          examples:
          - AP43
      - name: serial
        in: query
        description: Filter results by device serial number
        style: form
        explode: true
        schema:
          type: string
          examples:
          - FXLH2015150025
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 5c5b350e0001
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/jse_device'
                description: JSE devices returned for an organization
                examples:
                - - ext_ip: 73.92.124.103
                    last_seen: 1654636867
                    mac: c15353123096
                    model: EX2300-C-12P
                    serial: DGCOO0015
                contentMediaType: application/json
              examples:
                Example:
                  value:
                  - ext_ip: 73.92.124.103
                    last_seen: 1654636867
                    mac: c15353123096
                    model: EX2300-C-12P
                    serial: DGCOO0015
            application/vnd.api+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/jse_device'
                description: JSE devices returned for an organization
                examples:
                - - ext_ip: 73.92.124.103
                    last_seen: 1654636867
                    mac: c15353123096
                    model: EX2300-C-12P
                    serial: DGCOO0015
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
                  - ext_ip: 73.92.124.103
                    last_seen: 1654636867
                    mac: c15353123096
                    model: EX2300-C-12P
                    serial: DGCOO0015
        '400':
          description: Bad Syntax
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http400'
                - description: Standard HTTP 400 bad request error response
                  examples:
                  - detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http400'
                - description: Standard HTTP 400 bad request error response
                  examples:
                  - detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
