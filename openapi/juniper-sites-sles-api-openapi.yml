      description: Get the summary for the SLE metric trend
      operationId: getSiteSleSummaryTrend
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: scope
        in: path
        description: ''
        required: true
        schema:
          $ref: '#/components/schemas/site_sle_metric_summary_scope_parameters'
      - name: scope_id
        in: path
        description: '* site_id if `scope`==`site`

          * device_id if `scope`==`ap`, `scope`==`switch` or `scope`==`gateway`

          * mac if `scope`==`client`'
        required: true
        schema:
          type: string
      - name: metric
        in: path
        description: Values from `listSiteSlesMetrics`
        required: true
        schema:
          type: string
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
