                      - 5c5b35000008
                      esilaglinks:
                      - 5c5b3500000f
                      evpn_id: 1
                      mac: 5c5b35000003
                      model: QFX10002-36Q
                      role: collapsed-core
                      site_id: 1916d52a-4a90-11e5-8b45-1258369c38a9
                      uplinks:
                      - 5c5b35000005
                      - 5c5b35000006
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    id: 9197ec96-4c8d-529f-c595-035895e688b2
                    name: CC
                    overwrite: true
                    pod_names:
                      '1': default
