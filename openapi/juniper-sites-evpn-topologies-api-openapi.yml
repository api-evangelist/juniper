          description: Underlay subnet, by default, `10.255.240.0/20`, or `fd31:5700::/64` for ipv6
          examples:
          - 10.255.240.0/20
        use_ipv6:
          type: boolean
          description: If v6 is desired for underlay
          default: false
      description: EVPN underlay BGP and subnet settings for the topology
