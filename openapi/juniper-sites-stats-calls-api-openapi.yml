tags:
- name: Sites Stats - Calls
  description: API Calls to retrieve the stats of the calls (Zoom/Teams) detected by Mist
paths:
  /api/v1/sites/{site_id}/stats/calls/client/{client_mac}/troubleshoot:
    parameters: []
    get:
      tags:
      - Sites Stats - Calls
      summary: troubleshootSiteCall
      description: Troubleshoot a call
      operationId: troubleshootSiteCall
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: client_mac
        in: path
        description: ''
        required: true
        schema:
          pattern: ^[0-9a-fA-F]{12}$
          type: string
          examples:
          - 0000000000ab
      - name: meeting_id
        in: query
        description: Filter results by meeting identifier
        required: true
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 1234567890abcdef
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - '001122334455'
      - name: app
        in: query
        description: Third party app name
        style: form
        explode: true
        schema:
          type: string
          examples:
          - zoom
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
      responses:
        '200':
          description: Example response
          headers: {}
          content:
