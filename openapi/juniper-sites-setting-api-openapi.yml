    tunnel_via2:
      title: tunnel_via2
      enum:
      - primary
      - secondary
      type: string
      description: If `via`==`tunnel`, primary or secondary tunnel associated with this BGP neighbor
    simple_alert_dns_failure:
      title: simple_alert_dns_failure
