          examples:
          - 200
        idle_time_in_minutes:
          maximum: 43200
          minimum: 0
          type: integer
          description: Required if `surrogate_IP`==`true`, idle Time to Disassociation
          contentEncoding: int32
        name:
          type: string
          description: '[network]($h/Orgs%20Networks/_overview) name'
