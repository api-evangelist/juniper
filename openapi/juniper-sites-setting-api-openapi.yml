        config_revert_timer:
          maximum: 30
          minimum: 1
          type: integer
          description: Rollback timer for commit confirmed
          contentEncoding: int32
          default: 10
        dhcp_option_fqdn:
          type: boolean
          description: Enable to provide the FQDN with DHCP option 81
          default: false
        disable_oob_down_alarm:
          type: boolean
