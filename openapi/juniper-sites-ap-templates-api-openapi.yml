                      disable_radios_when_power_constrained: true
                      enable_arp_spoof: true
                      enable_shared_radio_scanning: false
                      enabled: true
                      locate_connected: false
                      locate_unconnected: false
                      mesh_allow_dfs: false
                      mesh_enable_crm: true
