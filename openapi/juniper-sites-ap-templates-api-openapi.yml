security:
- apiToken: []
- csrfToken: []
tags:
- name: Sites AP Templates
  description: 'AP Templates are defining Wi-Fi and AP settings that can be assigned to Access Points based on different types of rules.


    Site AP Templates are created and managed at the site level and can only be referenced and used within that particular site.'
paths:
  /api/v1/sites/{site_id}/aptemplates/derived:
    parameters: []
    get:
      tags:
      - Sites AP Templates
      summary: listSiteApTemplatesDerived
      description: Get the list of derived AP Templates for a site
      operationId: listSiteApTemplatesDerived
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: resolve
        in: query
        description: Whether resolve the site variables
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: Example response
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ap_template'
                description: List of AP templates
                examples:
                - - ap_matching:
                      enabled: true
                      rules:
                      - match_model: string
                        name: string
                        port_config:
                          eth1,eth2:
                            disabled: true
                            dynamic_vlan:
                              default_vlan_id: 999
                              enabled: true
                            port_vlan_id: 1
                            vlan_id: 9
                            vlan_ids: 1, 10, 50
                    created_time: 0
                    for_site: true
                    id: 497f6eca-6276-4993-bfeb-53cbbbba9f08
                    modified_time: 0
                    org_id: a40f5d1f-d889-42e9-94ea-b9b33585fc6b
                    site_id: 72771e6a-6f5e-4de4-a5b9-1266c4197811
                    wifi:
                      cisco_enabled: true
                      disable_11k: false
                      disable_radios_when_power_constrained: true
                      enable_arp_spoof: true
                      enable_shared_radio_scanning: false
                      enabled: true
                      locate_connected: false
                      locate_unconnected: false
                      mesh_allow_dfs: false
                      mesh_enable_crm: true
                      mesh_enabled: true
                      proxy_arp: false
                contentMediaType: application/json
              examples:
                Example:
                  value:
                  - ap_matching:
                      enabled: true
                      rules:
                      - match_model: string
                        name: string
                        port_config:
                          eth1,eth2:
                            disabled: true
                            dynamic_vlan:
                              default_vlan_id: 999
                              enabled: true
                            port_vlan_id: 1
                            vlan_id: 9
                            vlan_ids: 1, 10, 50
                    created_time: 0
                    for_site: true
                    id: 497f6eca-6276-4993-bfeb-53cbbbba9f08
