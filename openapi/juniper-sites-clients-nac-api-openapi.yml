  /api/v1/sites/{site_id}/nac_clients/events/search:
    parameters: []
    get:
      tags:
      - Sites Clients - NAC
      summary: searchSiteNacClientEvents
      description: Search NAC client events for a site with filters for authentication, NAC rule, identity provider, RADIUS, network, endpoint, and time attributes. Use Search Org NAC Client Events to search NAC client events across the organization.
      operationId: searchSiteNacClientEvents
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: type
        in: query
        description: See [List Device Events Definitions]($e/Constants%20Events/listNacEventsDefinitions)
        style: form
        explode: true
        schema:
          type: string
      - name: nacrule_id
        in: query
        description: NAC Policy Rule ID, if matched
        style: form
        explode: true
        schema:
          type: string
          contentEncoding: uuid
      - name: nacrule_matched
        in: query
        description: NAC Policy Rule Matched
        style: form
        explode: true
        schema:
          type: boolean
      - name: dryrun_nacrule_id
        in: query
        description: NAC Policy Dry Run Rule ID, if present and matched
        style: form
        explode: true
        schema:
          type: string
      - name: dryrun_nacrule_matched
        in: query
        description: True - if dryrun rule present and matched with priority, False - if not matched or not present
        style: form
        explode: true
        schema:
          type: boolean
      - name: auth_type
        in: query
        description: Authentication type, e.g. "eap-tls", "eap-peap", "eap-ttls", "eap-teap", "mab", "psk", "device-auth"
        style: form
        explode: true
        schema:
          type: string
      - name: vlan
        in: query
        description: Filter results by VLAN ID
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: nas_vendor
        in: query
        description: Vendor of NAS device
        style: form
        explode: true
        schema:
          type: string
      - name: bssid
        in: query
        description: Filter results by BSSID
        style: form
        explode: true
        schema:
          type: string
      - name: idp_id
        in: query
        description: SSO ID, if present and used
        style: form
        explode: true
        schema:
          type: string
          contentEncoding: uuid
      - name: idp_role
        in: query
        description: IDP returned roles/groups for the user
        style: form
        explode: true
        schema:
          type: string
      - name: idp_username
        in: query
        description: Username presented to the Identity Provider
        style: form
        explode: true
        schema:
          type: string
      - name: resp_attrs
        in: query
        description: RADIUS attributes returned by NAC to NAS Devive
        style: form
        explode: true
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
          examples:
          - - Tunnel-Type=VLAN
            - Tunnel-Medium-Type=IEEE-802
            - Tunnel-Private-Group-Id=750
            - User-Name=anonymous
      - name: ssid
        in: query
        description: Filter results by SSID
        style: form
        explode: true
        schema:
          type: string
      - name: username
        in: query
        description: Filter results by username
        style: form
        explode: true
        schema:
          type: string
      - name: ap
        in: query
        description: Filter results by AP MAC address
        style: form
        explode: true
        schema:
          type: string
      - name: random_mac
        in: query
        description: Filter results by whether the client is using a randomized MAC address
        style: form
        explode: true
        schema:
          type: boolean
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
      - name: usermac_label
        in: query
        description: Labels derived from usermac entry
        style: form
        explode: true
        schema:
          type: string
      - name: text
        in: query
        description: Partial / full MAC address, username, device_mac or ap. Use `prefix*` for prefix search or `*substring*` for contains search (e.g. `aabbcc*` and `*bbcc*` match `aabbccddeeff`). Suffix-only wildcards (e.g. `*bccddeeff`) are not supported
        style: form
        explode: true
        schema:
          type: string
      - name: nas_ip
        in: query
        description: IP address of NAS device
        style: form
        explode: true
        schema:
          type: string
      - name: ingress_vlan
        in: query
        description: Vendor specific VLAN ID in RADIUS requests
        style: form
        explode: true
        schema:
          type: string
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: sort
        in: query
        description: On which field the list should be sorted, -prefix represents DESC order.
        style: form
        explode: true
        schema:
          type: string
          default: wxid
          examples:
          - -site_id
      - name: search_after
        in: query
        description: Pagination cursor for retrieving subsequent pages of results. This value is automatically populated by Mist in the `next` URL from the previous response and should not be manually constructed.
        style: form
        explode: true
        schema:
