        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: sort
        in: query
        description: On which field the list should be sorted, -prefix represents DESC order
        style: form
        explode: true
        schema:
          type: string
          default: timestamp
          examples:
          - -site_id
      - name: search_after
        in: query
        description: Pagination cursor for retrieving subsequent pages of results. This value is automatically populated by Mist in the `next` URL from the previous response and should not be manually constructed.
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Example response
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_events_other_devices_search'
                - description: Paginated response for other-device event search results
                  examples:
                  - end: 0
                    limit: 0
                    results:
                    - device_mac: string
                      mac: 5c5b351e13b5
                      org_id: 4ac1dcf4-9d8b-7211-65c4-057819f0862a
                      site_id: 4ac1dcf4-9d8b-7211-65c4-057819f0862b
                      text: 'Plugged: The Internal 5GB (SIM1) has been inserted into Internal 1.'
                      timestamp: 547235620.89
                      type: CELLULAR_EDGE_MODEM_WAN_PLUGGED
                      vendor: cradlepoint
                    start: 0
                    total: 0
                contentMediaType: application/json
              examples:
