  /api/v1/sites/{site_id}/otherdevices/events/count:
    parameters: []
    get:
      tags:
      - Sites Devices - Others
      summary: countSiteOtherDeviceEvents
      description: Count third-party device events for a site, optionally grouped by the `distinct` field and filtered by event type and time range. Use Count Org Other Device Events to count third-party device events across the organization.
      operationId: countSiteOtherDeviceEvents
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: distinct
        in: query
        description: 'Field used to group this count response. enum: `mac`, `site_id`, `type`, `vendor`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/site_other_device_events_count_distinct'
          - description: 'Field used to group this count response. enum: `mac`, `site_id`, `type`, `vendor`'
      - name: type
        in: query
        description: See [List Device Events Definitions]($e/Constants%20Events/listOtherDeviceEventsDefinitions)
        style: form
        explode: true
        schema:
          type: string
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
