  /api/v1/sites/{site_id}/otherdevices/events/search:
    parameters: []
    get:
      tags:
      - Sites Devices - Others
      summary: searchSiteOtherDeviceEvents
      description: Search third-party device events for a site with filters for device identifiers, model, vendor, event type, and time range. Use Search Org Other Device Events to search third-party device events across the organization.
      operationId: searchSiteOtherDeviceEvents
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
      - name: device_mac
        in: query
        description: MAC of attached device
        style: form
        explode: true
        schema:
          type: string
      - name: vendor
        in: query
        description: Filter results by vendor
        style: form
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: See [List Device Events Definitions]($e/Constants%20Events/listOtherDeviceEventsDefinitions)
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
