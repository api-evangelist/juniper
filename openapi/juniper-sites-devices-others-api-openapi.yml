  description: API Call for 3rd party devices
paths:
  /api/v1/sites/{site_id}/otherdevices:
    parameters: []
    get:
      tags:
      - Sites Devices - Others
      summary: listSiteOtherDevices
      description: List third-party devices in a site, such as devices discovered or tracked outside the managed Mist device inventory. Use List Org Other Devices to retrieve third-party devices across the organization.
      operationId: listSiteOtherDevices
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: vendor
        in: query
        description: Filter results by vendor
        style: form
        explode: true
        schema:
          type: string
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
      - name: serial
        in: query
        description: Filter results by device serial number
        style: form
        explode: true
        schema:
          type: string
      - name: model
        in: query
        description: Filter results by device model
        style: form
        explode: true
        schema:
          type: string
      - name: name
        in: query
        description: Filter results by name
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
      responses:
        '200':
          description: Example response
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/device_other'
                description: List of third-party devices reported by external integrations
                examples:
                - - created_time: 1676983730
                    device_mac: '001122334455'
                    id: ae9dee49-69e7-4710-a114-5b827a777738
                    mac: 5c5b35000018
                    model: AP41
                    modified_time: 1676983730
                    name: hallway
                    org_id: 2818e386-8dec-2562-9ede-5b8a0fbbdc71
                    serial: FXLH2015150025
                    site_id: 4ac1dcf4-9d8b-7211-65c4-057819f0862b
                    vendor: cradlepoint
                contentMediaType: application/json
              examples:
                Example:
                  value:
                  - created_time: 1676983730
                    device_mac: '001122334455'
                    id: ae9dee49-69e7-4710-a114-5b827a777738
                    mac: 5c5b35000018
                    model: AP41
                    modified_time: 1676983730
                    name: hallway
                    org_id: 2818e386-8dec-2562-9ede-5b8a0fbbdc71
                    serial: FXLH2015150025
                    site_id: 4ac1dcf4-9d8b-7211-65c4-057819f0862b
                    vendor: cradlepoint
            application/vnd.api+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/device_other'
                description: List of third-party devices reported by external integrations
                examples:
                - - created_time: 1676983730
                    device_mac: '001122334455'
                    id: ae9dee49-69e7-4710-a114-5b827a777738
                    mac: 5c5b35000018
                    model: AP41
                    modified_time: 1676983730
                    name: hallway
                    org_id: 2818e386-8dec-2562-9ede-5b8a0fbbdc71
                    serial: FXLH2015150025
                    site_id: 4ac1dcf4-9d8b-7211-65c4-057819f0862b
                    vendor: cradlepoint
