openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform Users API
  description: Junos Space Network Management Platform provides a RESTful API for centralized management of Juniper devices. The API supports device discovery, configuration management, software image deployment, script management, and audit logging. Resources are accessed via the /api/space namespace with XML or JSON media types.
  version: 23.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Server
  variables:
    space_server:
      default: space.example.com
      description: Hostname or IP of the Junos Space server
security:
- basicAuth: []
tags:
- name: Users
  description: User and role management
paths:
  /user-management/users:
    get:
      operationId: listUsers
      summary: Juniper Networks List users
      description: Returns all users configured in Junos Space.
      tags:
      - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: object
                    properties:
                      user:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
  /user-management/roles:
    get:
      operationId: listRoles
      summary: Juniper Networks List roles
      description: Returns all roles available in Junos Space.
      tags:
      - Users
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: object
                    properties:
                      role:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
components:
  schemas:
    Role:
      type: object
      properties:
        roleId:
          type: integer
        name:
          type: string
        description:
          type: string
    User:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space user credentials
externalDocs:
  description: Junos Space REST API Documentation
  url: https://www.juniper.net/documentation/us/en/software/junos-space/
