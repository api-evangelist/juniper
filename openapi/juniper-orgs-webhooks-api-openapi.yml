                    enabled: true
                    headers: {}
                    id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    modified_time: 0
                    name: string
                    org_id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    secret: string
                    site_id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    splunk_token: string
                    topics:
                    - location
                    type: http-post
                    url: string
                    verify_cert: true
                contentMediaType: application/json
              examples:
                Example:
                  value:
                  - created_time: 0
                    enabled: true
                    headers: {}
                    id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    modified_time: 0
