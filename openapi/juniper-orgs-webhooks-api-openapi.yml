    webhook_delivery_status:
      title: webhook_delivery_status
      enum:
      - failure
      - success
      type: string
      description: 'webhook delivery status. enum: `failure`, `success`'
      examples:
      - failure
    webhook_delivery_topic:
      title: webhook_delivery_topic
      enum:
