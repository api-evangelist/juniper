openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform Scripts API
  description: Junos Space Network Management Platform provides a RESTful API for centralized management of Juniper devices. The API supports device discovery, configuration management, software image deployment, script management, and audit logging. Resources are accessed via the /api/space namespace with XML or JSON media types.
  version: 23.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Server
  variables:
    space_server:
      default: space.example.com
      description: Hostname or IP of the Junos Space server
security:
- basicAuth: []
tags:
- name: Scripts
  description: Script bundle management and execution
paths:
  /script-management/scripts:
    get:
      operationId: listScripts
      summary: Juniper Networks List scripts
      description: Returns all script bundles available in Junos Space.
      tags:
      - Scripts
      responses:
        '200':
          description: List of scripts
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: object
                    properties:
                      script:
                        type: array
                        items:
                          $ref: '#/components/schemas/Script'
  /script-management/scripts/{script_id}/execute:
    post:
      operationId: executeScript
      summary: Juniper Networks Execute script on devices
      description: Executes a script on one or more managed devices.
      tags:
      - Scripts
      parameters:
      - name: script_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                execRequest:
                  type: object
                  properties:
                    deviceIds:
                      type: array
                      items:
                        type: integer
                    scriptParams:
                      type: object
                      additionalProperties:
                        type: string
      responses:
        '202':
          description: Script execution job initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
components:
  schemas:
    Script:
      type: object
      properties:
        scriptId:
          type: integer
        name:
          type: string
        description:
          type: string
        scriptType:
          type: string
          enum:
          - op
          - event
          - commit
          - snmp
        language:
          type: string
          enum:
          - slax
          - xslt
          - python
    Job:
      type: object
      properties:
        jobId:
          type: integer
        name:
          type: string
        state:
          type: string
          enum:
          - INPROGRESS
          - SUCCESS
          - FAILURE
          - CANCELLED
        percentComplete:
          type: number
        createdTime:
          type: string
          format: date-time
        completedTime:
          type: string
          format: date-time
        summary:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space user credentials
externalDocs:
  description: Junos Space REST API Documentation
  url: https://www.juniper.net/documentation/us/en/software/junos-space/
