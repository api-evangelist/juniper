          examples:
          - - '2'
            - '3'
        separate_upstream_downstream:
          type: boolean
          description: Whether to separate upstream / downstream ports. default is false where all ports will be used.
          default: false
        upstream_port_vlan_id:
          oneOf:
          - type: string
