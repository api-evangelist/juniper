tags:
- name: Orgs Inventory
  description: The Org Inventory allows administrators to view and manage all devices registered (claimed) to the Organization.
paths:
  /api/v1/orgs/{org_id}/inventory:
    parameters: []
    get:
      tags:
      - Orgs Inventory
      summary: getOrgInventory
      description: 'Get Org Inventory


        ### VC (Virtual-Chassis) Management


        Starting with the April release, Virtual Chassis devices in Mist will now use

        a cloud-assigned virtual MAC address as the device ID, instead of the physical

        MAC address of the FPC0 member.


        **Retrieving the device ID or Site ID of a Virtual Chassis:**


        1. Use this API call with the query parameters `vc=true` and `mac` set to the MAC address of the VC member.


        2. In the response, check the `vc_mac` and `mac` fields:


        - If `vc_mac` is empty or not present, the device is not part of a Virtual Chassis.

        The `device_id` and `site_id` will be available in the device information.


        - If `vc_mac` differs from the `mac` field, the device is part of a Virtual Chassis

        but is not the device used to generate the Virtual Chassis ID. Use the `vc_mac` value with the Get Org Inventory

        API call to retrieve the `device_id` and `site_id`.


        - If `vc_mac` matches the `mac` field, the device is the device used to generate the Virtual Chassis ID and he `device_id` and `site_id` will be available

        in the device information.

        This is the case if the device is the Virtual Chassis "virtual device" (MAC starting with `020003`) or if the device is the Virtual Chassis FPC0 and the Virtual Chassis is still using the FPC0 MAC address to generate the device ID.'
      operationId: getOrgInventory
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: serial
        in: query
        description: Filter results by device serial number. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - PE3717390301,EY2523AN0523
          - FXLH2015150025
        examples:
          Untitled Example1:
            value: PE3717390301,EY2523AN0523
          Untitled Example2:
            value: FXLH2015150025
      - name: model
        in: query
        description: Filter results by device model. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - EX4300-48T,EX4100-48MP
          - AP43
        examples:
          Untitled Example1:
            value: EX4300-48T,EX4100-48MP
          Untitled Example2:
            value: AP43
      - name: type
        in: query
        description: 'Filter results by type. enum: `ap`, `gateway`, `switch`. Accepts multiple comma-separated values.'
        style: form
        explode: true
        schema:
          type: string
          examples:
          - switch,ap
      - name: mac
        in: query
        description: Filter results by MAC address. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 5c5b53010101,5c5b53020202
          - 5c5b350e0001
        examples:
          Untitled Example1:
            value: 5c5b53010101,5c5b53020202
          Untitled Example2:
            value: 5c5b350e0001
      - name: site_id
        in: query
        description: Filter results by one site identifier. Use a single value; comma-separated values are not supported
        style: form
        explode: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 4ac1dcf4-9d8b-7211-65c4-057819f0862b
      - name: vc_mac
        in: query
        description: Virtual Chassis MAC address. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 5c5b53010101,5c5b53020202
          - 5c5b350e0001
        examples:
          Untitled Example1:
            value: 5c5b53010101,5c5b53020202
          Untitled Example2:
            value: 5c5b350e0001
      - name: vc
        in: query
        description: To display Virtual Chassis members
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          examples:
          - false
      - name: unassigned
        in: query
        description: To display Unassigned devices
        style: form
        explode: true
        schema:
          type: boolean
          default: true
          examples:
          - true
      - name: modified_after
        in: query
        description: Filter on inventory last modified time, in epoch
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
          examples:
          - 1703003296
      - name: disconnected_before
        in: query
        description: Filter results to devices that were last disconnected before this time, in epoch seconds
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
          examples:
          - 1733522845
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
