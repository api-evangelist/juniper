  /api/v1/orgs/{org_id}/inventory/search:
    parameters: []
    get:
      tags:
      - Orgs Inventory
      summary: searchOrgInventory
      description: Search organization inventory records with filters for type, MAC address, model, name, site, serial number, Virtual Chassis master state, SKU, version, status, and text.
      operationId: searchOrgInventory
      parameters:
      - name: org_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: type
        in: query
        description: 'Filter results by type. enum: `ap`, `gateway`, `switch`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/device_type_default_ap'
          - description: 'Filter results by type. enum: `ap`, `gateway`, `switch`'
      - name: mac
        in: query
        description: Filter by MAC address. Partial matches may use `*` wildcards (e.g. `*5b35*` matches `5c5b350e0001` and `5c5b35000301`). Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 5c5b350e0001,*5b35*
          - 5c5b350e0001
          - '*5b35*'
        examples:
          Untitled Example1:
            value: 5c5b350e0001,*5b35*
          Untitled Example2:
            value: 5c5b350e0001
          Untitled Example3:
            value: '*5b35*'
      - name: model
        in: query
        description: Partial / full Device model. Use `prefix*` for prefix search or `*substring*` for contains search (e.g. `AP4*` and `*P4*` match `AP43`). Suffix-only wildcards (e.g. `*43`) are not supported. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - AP43,AP4*
          - AP43
          - AP4*
          - '*P4*'
        examples:
          Untitled Example1:
            value: AP43,AP4*
          Untitled Example2:
            value: AP43
          Untitled Example3:
            value: AP4*
          Untitled Example4:
            value: '*P4*'
      - name: name
        in: query
        description: Device name. Always a partial match (e.g. `london` will match `london-1`, `london-2`, `my-london-device`...). Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - name-a,name-b
          - london
        examples:
          Untitled Example1:
            value: name-a,name-b
          Untitled Example2:
            value: london
      - name: site_id
        in: query
        description: Filter inventory results by site identifier. Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 4ac1dcf4-9d8b-7211-65c4-057819f0862b
        examples:
          Untitled Example2:
            value: 4ac1dcf4-9d8b-7211-65c4-057819f0862b
      - name: serial
        in: query
        description: Device serial number. Partial match allowed with wildcard * (e.g. `*123*` will match `AB123CD`, `12345`, `XY123`). Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - AB123CD,*123*
          - AB123CD
          - '*123*'
        examples:
          Untitled Example1:
            value: AB123CD,*123*
          Untitled Example2:
            value: AB123CD
          Untitled Example3:
            value: '*123*'
      - name: magic
        in: query
        description: Device claim code (magic). Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - WVTFBLTNPXD23H2
      - name: master
        in: query
        description: Filter inventory results by whether the device is the Virtual Chassis master
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 'true'
      - name: sku
        in: query
        description: Device SKU. Partial match allowed with wildcard * (e.g. `*2300*` will match `EX2300-F-12P`). Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - EX2300-F-12P,*2300*
          - EX2300-F-12P
          - '*2300*'
        examples:
          Untitled Example1:
            value: EX2300-F-12P,*2300*
          Untitled Example2:
            value: EX2300-F-12P
          Untitled Example3:
            value: '*2300*'
      - name: version
        in: query
        description: Device version. Partial match allowed with wildcard * (e.g. `2R3` will match `21.2R3-S3.5`). Accepts multiple comma-separated values.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 21.2R3-S3.5,*2R3*
          - 21.2R3-S3.5
          - '*2R3*'
        examples:
          Untitled Example1:
            value: 21.2R3-S3.5,*2R3*
          Untitled Example2:
            value: 21.2R3-S3.5
          Untitled Example3:
            value: '*2R3*'
      - name: status
        in: query
        description: 'Device status. enum: `connected`, `disconnected`. Accepts multiple comma-separated values.'
        style: form
        explode: true
        schema:
          type: string
          examples:
          - connected,disconnected
      - name: text
        in: query
        description: Wildcards for name, mac, serial
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: sort
        in: query
        description: On which field the list should be sorted, -prefix represents DESC order
        style: form
        explode: true
        schema:
          type: string
          default: timestamp
          examples:
          - -site_id
      - name: search_after
        in: query
        description: Pagination cursor for retrieving subsequent pages of results. This value is automatically populated by Mist in the `next` URL from the previous response and should not be manually constructed.
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/inventory_search'
                - description: Paginated inventory search response
                  examples:
                  - limit: 1000
                    results:
                    - mac: f01c2df166e0
                      magic: WVTFBLTNPXD23H2
                      master: true
                      members:
                      - mac: f01c2df166e0
                        model: EX4300-48P
                        serial: PD3714460200
                      model: EX4300-48P
                      name: mist-wa-ex4300-VC
                      org_id: 9b853544-51e4-45fb-81ac-a442e4a111d0
                      serial: PD3714460200
                      site_id: 01dc141d-b6af-4baa-b00f-0e31ef954c4f
                      sku: EX4300-48P
                      status: disconnected
                      type: switch
                      vc_mac: f01c2df166e0
                      version: 21.4R3.5
                    total: 1
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    limit: 1000
                    results:
                    - mac: f01c2df166e0
                      magic: WVTFBLTNPXD23H2
