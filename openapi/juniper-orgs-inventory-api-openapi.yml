          type: string
          description: Site associated with this inventory record, when assigned
          contentEncoding: uuid
          readOnly: true
          examples:
          - 441a1214-6928-442a-8e92-e1d34b8ec6a6
        sku:
          type: string
          description: Device stock keeping unit
