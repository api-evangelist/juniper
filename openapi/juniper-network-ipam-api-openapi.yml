openapi: 3.1.0
info:
  title: Juniper Networks Juniper Apstra Allowlists and Blocklists Network IPAM API
  description: Juniper Apstra is an intent-based networking platform for data center automation. The Apstra API provides RESTful access to manage blueprints, design elements, devices, connectivity templates, virtual networks, and intent-based analytics. It supports multivendor environments and enables closed-loop automation from design through deployment and operations.
  version: 4.2.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/us/en/products/network-automation/apstra.html
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
  termsOfService: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{apstra_server}/api
  description: Apstra Server
  variables:
    apstra_server:
      default: apstra.example.com
      description: Hostname or IP of the Apstra server
security:
- authToken: []
tags:
- name: Network IPAM
  description: IP Address Management
paths:
  /network-ipams:
    get:
      operationId: listNetworkIpams
      summary: Juniper Networks List network IPAMs
      description: Returns all IP Address Management configurations.
      tags:
      - Network IPAM
      parameters:
      - $ref: '#/components/parameters/ParentId'
      - $ref: '#/components/parameters/DetailParam'
      responses:
        '200':
          description: List of network IPAMs
          content:
            application/json:
              schema:
                type: object
                properties:
                  network-ipams:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceRef'
    post:
      operationId: createNetworkIpam
      summary: Juniper Networks Create network IPAM
      description: Creates a new IP Address Management configuration.
      tags:
      - Network IPAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network-ipam:
                  $ref: '#/components/schemas/NetworkIpam'
      responses:
        '200':
          description: Network IPAM created
components:
  parameters:
    DetailParam:
      name: detail
      in: query
      description: Return full object details instead of references
      schema:
        type: boolean
        default: false
    ParentId:
      name: parent_id
      in: query
      description: Filter by parent resource UUID
      schema:
        type: string
        format: uuid
  schemas:
    NetworkIpam:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        display_name:
          type: string
        ipam_method:
          type: string
          enum:
          - dhcp
          - fixed
        ipam_dns_method:
          type: string
          enum:
          - default-dns-server
          - virtual-dns-server
          - tenant-dns-server
          - none
    ResourceRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        href:
          type: string
          format: uri
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: AuthToken
      description: Authentication token obtained from the /aaa/login endpoint. Include as AuthToken header in all requests.
externalDocs:
  description: Apstra API Documentation
  url: https://www.juniper.net/documentation/us/en/software/apstra/
