openapi: 3.2.0
info:
  title: Juniper Networks Juniper Contrail Networking Network IPAM API
  description: Juniper Contrail (now Cloud-Native Contrail Networking) provides an SDN controller with a RESTful API for managing virtual networks, network policies, security groups, and service chaining. The API server runs on port 8082 and provides CRUD operations on networking objects. It supports multi-tenancy through project-based resource isolation and integrates with OpenStack, Kubernetes, and VMware orchestrators.
  version: 5.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/contrail-networking/
    email: support@juniper.net
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{contrail_controller}:8082
  description: Contrail API Server
  variables:
    contrail_controller:
      default: contrail.example.com
      description: Hostname or IP of the Contrail controller
security:
- keystoneAuth: []
tags:
- name: Network IPAM
  description: IP Address Management
paths:
  /network-ipams:
    get:
      operationId: listNetworkIpams
      summary: Juniper Networks List network IPAMs
      description: Returns all IP Address Management configurations.
      tags:
      - Network IPAM
      parameters:
      - $ref: '#/components/parameters/ParentId'
      - $ref: '#/components/parameters/DetailParam'
      responses:
        '200':
          description: List of network IPAMs
          content:
            application/json:
              schema:
                type: object
                properties:
                  network-ipams:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceRef'
    post:
      operationId: createNetworkIpam
      summary: Juniper Networks Create network IPAM
      description: Creates a new IP Address Management configuration.
      tags:
      - Network IPAM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network-ipam:
                  $ref: '#/components/schemas/NetworkIpam'
      responses:
        '200':
          description: Network IPAM created
components:
  schemas:
    NetworkIpam:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        display_name:
          type: string
        ipam_method:
          type: string
          enum:
          - dhcp
          - fixed
        ipam_dns_method:
          type: string
          enum:
          - default-dns-server
          - virtual-dns-server
          - tenant-dns-server
          - none
    ResourceRef:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        fq_name:
          type: array
          items:
            type: string
        href:
          type: string
          format: uri
  parameters:
    DetailParam:
      name: detail
      in: query
      description: Return full object details instead of references
      schema:
        type: boolean
        default: false
    ParentId:
      name: parent_id
      in: query
      description: Filter by parent resource UUID
      schema:
        type: string
        format: uuid
  securitySchemes:
    keystoneAuth:
      type: http
      scheme: bearer
      description: Keystone token authentication. Obtain a token from the Keystone identity service and pass it as X-Auth-Token header.
externalDocs:
  description: Contrail API Documentation
  url: https://www.juniper.net/documentation/us/en/software/contrail/
