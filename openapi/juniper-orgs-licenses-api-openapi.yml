              - $ref: '#/components/schemas/claim_activation'
              - description: Request Body
                examples:
                - code: ZHT3K-H36DT-MG85D-M61AC
                  type: all
              contentMediaType: application/json
            examples:
              Example:
                value:
                  code: ZHT3K-H36DT-MG85D-M61AC
                  type: all
        required: false
