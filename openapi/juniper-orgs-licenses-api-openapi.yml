        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_claim_license'
                - description: Result of claiming licenses or activation codes
                  examples:
                  - inventory_added:
                    - mac: 5c5b35000018
                      magic: 6JG8EPTFV2A9Z2N
                      model: AP41
                      serial: FXLH2015150025
                      type: ap
                    inventory_duplicated:
                    - mac: 5c5b35000012
                      magic: DVH4VSNMSZPDXBR
                      model: AP41
                      serial: FXLH2015150027
                      type: ap
                    inventory_pending:
                    - mac: 5c5b35000012
                    license_added:
                    - end: 1520380800
                      quantity: 180
                      start: 1504828800
                      type: SUB-MAN
                    - end: 1520380800
                      quantity: 120
                      start: 1504828800
                      type: SUB-LOC
                    license_duplicated:
                    - end: 1520380800
                      quantity: 180
                      start: 1504828800
                      type: SUB-MAN
                    license_error:
                    - order: '00000464'
                      reason: ''
                contentMediaType: application/json
              examples:
                Licenses Successfully Claimed And Applied:
                  value:
                    inventory_added:
                    - mac: 5c5b35000018
                      magic: 6JG8EPTFV2A9Z2N
                      model: AP41
                      serial: FXLH2015150025
                      type: ap
                    inventory_duplicated:
                    - mac: 5c5b35000012
                      magic: DVH4VSNMSZPDXBR
                      model: AP41
                      serial: FXLH2015150027
