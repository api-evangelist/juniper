  /api/v1/sites/{site_id}/wired_clients/search:
    parameters: []
    get:
      tags:
      - Sites Clients - Wired
      summary: searchSiteWiredClients
      description: Search wired clients for a site with filters for device MAC address, client MAC address, IP address, switch port, VLAN, manufacturer, DHCP attributes, NAC rule, and time range. Use Search Org Wired Clients to search wired clients across the organization.
      operationId: searchSiteWiredClients
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: device_mac
        in: query
        description: Filter results by device MAC address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 0123456789ab
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 0123456789ab
      - name: ip
        in: query
        description: Filter results by IP address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 10.3.5.12
      - name: port_id
        in: query
        description: Filter results by port identifier
        style: form
        explode: true
        schema:
          type: string
          examples:
          - ge-1/1/1
      - name: source
        in: query
        description: 'Filter results by client learning source. enum: `lldp`, `mac`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/client_info_source'
          - description: 'Filter results by client learning source. enum: `lldp`, `mac`'
      - name: vlan
        in: query
        description: Filter results by VLAN ID
        style: form
        explode: true
        schema:
          type: string
          examples:
          - '10'
      - name: manufacture
        in: query
        description: Filter results by manufacturer
        style: form
        explode: true
        schema:
          type: string
          examples:
          - Juniper-Mist
      - name: text
        in: query
        description: Single entry of hostname/mac
        style: form
        explode: true
        schema:
          type: string
          examples:
          - client-hostname
      - name: nacrule_id
        in: query
        description: Filter results by NAC rule identifier
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 8bfc2490-d726-3587-038d-cb2e71bd2330
      - name: dhcp_hostname
        in: query
        description: Filter results by DHCP hostname
        style: form
        explode: true
        schema:
          type: string
          examples:
          - client-hostname
      - name: dhcp_fqdn
        in: query
        description: Filter results by DHCP FQDN
        style: form
        explode: true
        schema:
          type: string
          examples:
          - client.example.com
      - name: dhcp_client_identifier
        in: query
        description: Filter results by DHCP client identifier
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 01:23:45:67:89:ab
      - name: dhcp_vendor_class_identifier
        in: query
        description: DHCP Vendor Class Identifier
        style: form
        explode: true
        schema:
          type: string
          examples:
          - Juniper-Mist-AP,Juniper-Mist-Client
      - name: dhcp_request_params
        in: query
        description: Filter results by DHCP request parameters
        style: form
        explode: true
        schema:
          type: string
          examples:
          - hostname,domain-name,domain-name-servers
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: sort
        in: query
        description: On which field the list should be sorted, -prefix represents DESC order
        style: form
        explode: true
        schema:
          type: string
          default: timestamp
          examples:
          - -site_id
      - name: search_after
        in: query
        description: Pagination cursor for retrieving subsequent pages of results. This value is automatically populated by Mist in the `next` URL from the previous response and should not be manually constructed.
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/search_wired_client'
                - description: Paginated response for wired client searches
                  examples:
                  - end: 1648529800.8221116
                    limit: 1000
                    results:
                    - auth_method: mac_auth
                      auth_state: authenticated
                      device_mac:
                      - '001122334455'
                      dhcp_client_identifier: MAC address 00155df6d500
                      dhcp_client_options:
                      - code: DHO_DHCP_MESSAGE_TYPE(53)
