      - name: protocol
        in: query
        description: 'Connectivity protocol used to filter synthetic test results. enum: `ping`, `traceroute`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/synthetictest_protocol'
          - description: 'Connectivity protocol used to filter synthetic test results. enum: `ping`, `traceroute`'
      - name: tenant
