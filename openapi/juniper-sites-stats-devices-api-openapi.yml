tags:
- name: Sites Stats - Devices
  description: API Calls to retrieve statistics about the Mist Managed and Monitored Devices at the Site level
paths:
  /api/v1/sites/{site_id}/stats/devices:
    parameters: []
    get:
      tags:
      - Sites Stats - Devices
      summary: listSiteDevicesStats
      description: List device statistics for a site, including high-level status and performance fields over the requested time range. Use List Org Device Stats to retrieve device statistics across the organization.
      operationId: listSiteDevicesStats
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: type
        in: query
        description: Filter results by type
        style: form
        explode: true
        schema:
          type: string
          default: ap
      - name: status
        in: query
        description: 'Filter results by status. enum: `all`, `connected`, `disconnected`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/stat_device_status_filter'
          - description: 'Filter results by status. enum: `all`, `connected`, `disconnected`'
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: page
        in: query
        description: Select the page number to return when using page-based pagination; starts at `1`
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          contentEncoding: int32
          default: 1
