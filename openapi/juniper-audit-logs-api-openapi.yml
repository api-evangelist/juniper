openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform Audit Logs API
  description: Junos Space Network Management Platform provides a RESTful API for centralized management of Juniper devices. The API supports device discovery, configuration management, software image deployment, script management, and audit logging. Resources are accessed via the /api/space namespace with XML or JSON media types.
  version: 23.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Server
  variables:
    space_server:
      default: space.example.com
      description: Hostname or IP of the Junos Space server
security:
- basicAuth: []
tags:
- name: Audit Logs
  description: Audit trail and logging
paths:
  /audit-log/events:
    get:
      operationId: listAuditEvents
      summary: Juniper Networks List audit events
      description: Returns audit log events for Junos Space operations.
      tags:
      - Audit Logs
      parameters:
      - name: startTime
        in: query
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PageStart'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  auditEvents:
                    type: object
                    properties:
                      auditEvent:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEvent'
components:
  parameters:
    PageStart:
      name: paging.start
      in: query
      description: Starting index for pagination
      schema:
        type: integer
        default: 0
    PageSize:
      name: paging.limit
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 25
  schemas:
    AuditEvent:
      type: object
      properties:
        eventId:
          type: integer
        userName:
          type: string
        taskName:
          type: string
        state:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space user credentials
externalDocs:
  description: Junos Space REST API Documentation
  url: https://www.juniper.net/documentation/us/en/software/junos-space/
