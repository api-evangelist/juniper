                    site_id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    specs:
                    - port_range: string
                      protocol: tcp
                      subnets:
                      - string
                    subnet: string
                    type: match
                    values:
                    - string
                contentMediaType: application/json
              examples:
                Example:
                  value:
                  - created_time: 0
                    id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    last_ips:
                    - string
                    mac: string
