      requestBody:
        description: Request Body
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/wxlan_tag'
              - description: Request Body
                examples:
                - '{"match":"app","name":"match app","type":"match","values":["gmail","dropbox"]}'
                - '{"match":"client_mac","name":"file_servers","type":"match","values":["b0c4e7001543","a0c4e7001543","00c4e7001543"]}'
                - '{"match":"hostname","name":"mist","type":"match","values":["mist.com"]}'
                - '{"match":"ip_range_subnet","name":"file_servers","type":"match","values":["10.1.2.1","10.2.3.4/24","10.1.2.5-10.2.3.4"]}'
                - '{"match":"port","name":"web-ports","type":"match","values":["80","8000","8080"]}'
                - '{"match":"psk_name","name":"VIP","type":"match","values":["test_key1","test_key2"]}'
                - '{"match":"psk_role","name":"VIP","type":"match","values":["test_role"]}'
                - '{"match":"radius_group","name":"VIP","type":"match","values":["vip"]}'
                - '{"match":"radius_username","name":"VIP","type":"match","values":["john@abc.com","eric@abc.com"]}'
                - '{"name":"protocol-subnet-port","specs":[{"port_range":"80","protocol":"tcp","subnets":["10.1.2.0/24"]}],"type":"spec"}'
                - '{"name":"vlan-assignment","type":"vlan","vlan_id":1055}'
                - '{"match":"wlan_id","name":"guest-wlan","type":"match","values":["be22bba78e22e1cf5185b880816fe2cf"]}'
              contentMediaType: application/json
            examples:
              app:
                value:
                  match: app
                  name: match app
                  type: match
                  values:
                  - gmail
                  - dropbox
              client_mac:
                value:
                  match: client_mac
                  name: file_servers
                  type: match
                  values:
                  - b0c4e7001543
                  - a0c4e7001543
                  - 00c4e7001543
              hostnames:
                value:
                  match: hostname
                  name: mist
                  type: match
                  values:
                  - mist.com
              ip_range_subnets:
                value:
                  match: ip_range_subnet
                  name: file_servers
                  type: match
                  values:
                  - 10.1.2.1
                  - 10.2.3.4/24
                  - 10.1.2.5-10.2.3.4
              ports:
                value:
                  match: port
                  name: web-ports
                  type: match
                  values:
                  - '80'
                  - '8000'
                  - '8080'
              psk_name:
                value:
                  match: psk_name
                  name: VIP
                  type: match
                  values:
                  - test_key1
                  - test_key2
              psk_role:
                value:
                  match: psk_role
                  name: VIP
                  type: match
                  values:
                  - test_role
              radius_group:
                value:
                  match: radius_group
                  name: VIP
                  type: match
                  values:
                  - vip
              radius_username:
                value:
                  match: radius_username
                  name: VIP
                  type: match
                  values:
                  - john@abc.com
                  - eric@abc.com
              traffic-spec:
                value:
                  name: protocol-subnet-port
                  specs:
                  - port_range: '80'
                    protocol: tcp
                    subnets:
                    - 10.1.2.0/24
                  type: spec
              vlan:
                value:
                  name: vlan-assignment
                  type: vlan
                  vlan_id: 1055
              wlan_id:
                value:
                  match: wlan_id
                  name: guest-wlan
                  type: match
                  values:
                  - be22bba78e22e1cf5185b880816fe2cf
        required: false
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/wxlan_tag'
                - description: "WxLAN Tag\n  * type:\n    * client: created manually (e.g. on wireless client table, when they spot a device of interest, they can create a wxlan tag for it\n    * resource: created automatically when we discover a network resource\n    * subnet: create automatically when a subnet is discovered\n  * match:\n    * wlan_id, ap_id: values are a list of Wlan / Device ids\n    * client_mac: values are a list of MAC addresses\n  * radius_group: this is a smart tag that matches RADIUS-Filter-ID, Airespace-ACL-Name (VendorID=14179, VendorType=6) / Aruba-User-Role (VendorID=14823, VendorType=1)\n  * radius_username: this matches the ATTR-User-Name(1)\n  * radius_class: the matches the ATTR-Class(25)\n  * radius_attr: the values are [ \"6=1\" , \"26=10.2.3.4\" ], this support other RADIUS attributes where we know the type\n  * radius_vendor: the values are [ \"14179.10=1\" , \"14178.16=1.2.3.4\" ], this matches vendor attributes and will be dynamically evaluated"
                  examples:
                  - created_time: 0
                    id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    last_ips:
                    - string
                    mac: string
                    match: wlan_id
                    modified_time: 0
                    name: string
                    op: in
                    org_id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    resource_mac: string
                    services:
                    - string
                    site_id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    specs:
                    - port_range: string
                      protocol: tcp
                      subnets:
                      - string
                    subnet: string
                    type: match
                    values:
                    - string
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    created_time: 0
                    id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    last_ips:
                    - string
                    mac: string
                    match: wlan_id
                    modified_time: 0
                    name: string
                    op: in
                    org_id: b069b358-4c97-5319-1f8c-7c5ca64d6ab1
                    resource_mac: string
                    services:
