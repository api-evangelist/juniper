  /api/v1/sites/{site_id}/rogues/events/search:
    parameters: []
    get:
      tags:
      - Sites Rogues
      summary: searchSiteRogueEvents
      description: Search Rogue Events
      operationId: searchSiteRogueEvents
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: type
        in: query
        description: 'Rogue classification used to filter the results. enum: `honeypot`, `lan`, `others`, `spoof`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/rogue_type'
          - description: 'Rogue classification used to filter the results. enum: `honeypot`, `lan`, `others`, `spoof`'
      - name: ssid
        in: query
        description: Filter results by SSID
        style: form
        explode: true
        schema:
          type: string
      - name: bssid
        in: query
        description: Filter results by BSSID
        style: form
        explode: true
        schema:
          type: string
      - name: ap_mac
        in: query
        description: MAC of the device that had strongest signal strength for ssid/bssid pair
        style: form
        explode: true
        schema:
          type: string
      - name: channel
        in: query
        description: Filter results by channel
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: seen_on_lan
        in: query
        description: Whether the reporting AP see a wireless client (on LAN) connecting to it
        style: form
        explode: true
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
