                  examples:
                  - end: 1538074800
                    limit: 10
                    results:
                    - ap: 5c5b350e10030
                      bssid: 38ff363c8c4c
                      channel: 136
                      rssi: -54
                      ssid: MyHomeNetwork
                      timestamp: 1538074612
                    - ap: 5c5b350e10030
                      bssid: 60d02c2394cc
                      channel: 11
                      rssi: -59
                      ssid: Home-Office
