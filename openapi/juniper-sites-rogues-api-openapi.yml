openapi: 3.2.0
info:
  title: Mist Sites Rogues API
  description: '> Version: **2607.1.1**

    >

    > Date: **August 17, 2026**


    NOTE:

    Some important API changes will be introduced.'
  contact:
    name: Thomas Munzer
    email: tmunzer@juniper.net
  version: 2607.1.1
servers:
- url: https://api.mist.com
  variables: {}
- url: https://api.gc1.mist.com
  variables: {}
- url: https://api.ac2.mist.com
  variables: {}
- url: https://api.gc2.mist.com
  variables: {}
- url: https://api.gc4.mist.com
  variables: {}
- url: https://api.eu.mist.com
  variables: {}
- url: https://api.gc3.mist.com
  variables: {}
- url: https://api.ac6.mist.com
  variables: {}
- url: https://api.gc6.mist.com
  variables: {}
- url: https://api.ac5.mist.com
  variables: {}
- url: https://api.gc5.mist.com
  variables: {}
- url: https://api.gc7.mist.com
  variables: {}
security:
- apiToken: []
- csrfToken: []
tags:
- name: Sites Rogues
  description: 'Rogues are unauthorized wireless access points that are installed on a network without authorization.


    They can be connected to the LAN via an ethernet cable, similar to a pc, and are typically set up by individuals with malicious intent or by employees trying to cover a dead spot with their own wi-fi hotspot.'
paths:
  /api/v1/sites/{site_id}/insights/rogues:
    parameters: []
    get:
      tags:
      - Sites Rogues
      summary: listSiteRogueAPs
      description: Get List of Site Rogue/Neighbor APs
      operationId: listSiteRogueAPs
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: type
        in: query
        description: 'Rogue classification used to filter the results. enum: `honeypot`, `lan`, `others`, `spoof`'
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/rogue_type'
          - description: 'Rogue classification used to filter the results. enum: `honeypot`, `lan`, `others`, `spoof`'
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: interval
        in: query
        description: Aggregation works by giving a time range plus interval (e.g. 1d, 1h, 10m) where aggregation function would be applied to.
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 10m
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_insight_rogue'
                - description: Paginated response for rogue or neighbor AP insight results
                  examples:
                  - end: 1428954000
                    limit: 100
                    next: /api/v1/sites/a3eda150-ab3f-11e4-aa18-13e21dd250cc/rogues?start=1498482000&end=1498485600&limit=10&interval=1h&type=others
                    results:
                    - ap_mac: 5c5b350e021c
                      avg_rssi: -72
                      bssid: d8-97-ba-76-b5-aa
                      channel: '11'
                      num_aps: 4
                      ssid: xfinitywifi
                      times_heard: 8
                    start: 1428939600
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    end: 1428954000
                    limit: 100
                    next: /api/v1/sites/a3eda150-ab3f-11e4-aa18-13e21dd250cc/rogues?start=1498482000&end=1498485600&limit=10&interval=1h&type=others
                    results:
                    - ap_mac: 5c5b350e021c
                      avg_rssi: -72
                      bssid: d8-97-ba-76-b5-aa
                      channel: '11'
                      num_aps: 4
                      ssid: xfinitywifi
                      times_heard: 8
                    start: 1428939600
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_insight_rogue'
                - description: Paginated response for rogue or neighbor AP insight results
                  examples:
                  - end: 1428954000
                    limit: 100
                    next: /api/v1/sites/a3eda150-ab3f-11e4-aa18-13e21dd250cc/rogues?start=1498482000&end=1498485600&limit=10&interval=1h&type=others
                    results:
                    - ap_mac: 5c5b350e021c
                      avg_rssi: -72
                      bssid: d8-97-ba-76-b5-aa
                      channel: '11'
                      num_aps: 4
                      ssid: xfinitywifi
                      times_heard: 8
                    start: 1428939600
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
                    end: 1428954000
                    limit: 100
                    next: /api/v1/sites/a3eda150-ab3f-11e4-aa18-13e21dd250cc/rogues?start=1498482000&end=1498485600&limit=10&interval=1h&type=others
                    results:
                    - ap_mac: 5c5b350e021c
                      avg_rssi: -72
                      bssid: d8-97-ba-76-b5-aa
                      channel: '11'
                      num_aps: 4
                      ssid: xfinitywifi
                      times_heard: 8
                    start: 1428939600
