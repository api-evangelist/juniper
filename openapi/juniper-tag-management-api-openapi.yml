openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform Tag Management API
  description: Junos Space Network Management Platform provides a RESTful API for centralized management of Juniper devices. The API supports device discovery, configuration management, software image deployment, script management, and audit logging. Resources are accessed via the /api/space namespace with XML or JSON media types.
  version: 23.1.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Server
  variables:
    space_server:
      default: space.example.com
      description: Hostname or IP of the Junos Space server
security:
- basicAuth: []
tags:
- name: Tag Management
paths:
  /tag-management/tags:
    get:
      operationId: listTags
      summary: Juniper Networks List tags
      description: Returns all tags used for device grouping.
      tags:
      - Tag Management
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: object
                    properties:
                      tag:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tag'
    post:
      operationId: createTag
      summary: Juniper Networks Create a tag
      description: Creates a new tag for device grouping.
      tags:
      - Tag Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
      responses:
        '201':
          description: Tag created
components:
  schemas:
    Tag:
      type: object
      properties:
        tagId:
          type: integer
        name:
          type: string
        type:
          type: string
          enum:
          - public
          - private
        description:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space user credentials
externalDocs:
  description: Junos Space REST API Documentation
  url: https://www.juniper.net/documentation/us/en/software/junos-space/
