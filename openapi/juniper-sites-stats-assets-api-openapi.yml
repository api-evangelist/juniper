  /api/v1/sites/{site_id}/stats/assets/search:
    parameters: []
    get:
      tags:
      - Sites Stats - Assets
      summary: searchSiteAssets
      description: Search asset statistics for a site with filters for asset identifiers, device, map, beacon, AP, RSSI, and time range. Use Search Org Assets to search asset statistics across the organization.
      operationId: searchSiteAssets
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: mac
        in: query
        description: Filter results by MAC address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - '001122334455'
      - name: map_id
        in: query
        description: Filter results by map identifier
        style: form
        explode: true
        schema:
          type: string
          examples:
          - b069b358-4c97-5319-1f8c-7c5ca64d6ab1
      - name: ibeacon_uuid
        in: query
        description: Filter asset results by iBeacon UUID
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 3ce2ef69-4414-469d-9d55-3ec7fcc38520
      - name: ibeacon_major
        in: query
        description: Filter asset results by iBeacon major value
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
          examples:
          - 1
      - name: ibeacon_minor
        in: query
        description: Filter asset results by iBeacon minor value
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
          examples:
          - 1
      - name: eddystone_uid_namespace
        in: query
        description: Filter asset results by Eddystone UID namespace
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 1234567890abcdef1234567890abcdef
      - name: eddystone_uid_instance
        in: query
        description: Filter asset results by Eddystone UID instance
        style: form
        explode: true
        schema:
          type: string
          examples:
          - 1234567890abcdef1234567890abcdef
      - name: eddystone_url
        in: query
        description: Filter asset results by Eddystone URL
        style: form
        explode: true
        schema:
          type: string
          examples:
          - https://example.com
      - name: device_name
        in: query
        description: Filter asset results by reporting device name
        style: form
        explode: true
        schema:
          type: string
          examples:
          - Device Name
      - name: by
        in: query
        description: Select how the value should be returned
        style: form
        explode: true
        schema:
          type: string
          examples:
          - mac
      - name: name
        in: query
        description: Filter results by name
        style: form
        explode: true
        schema:
          type: string
          examples:
          - Asset Name
      - name: ap_mac
        in: query
        description: Filter asset results by reporting AP MAC address
        style: form
        explode: true
        schema:
          type: string
          examples:
          - '001122334455'
      - name: beam
        in: query
        description: Filter asset results by beam value
        style: form
        explode: true
        schema:
          type: string
          examples:
          - '0'
      - name: rssi
        in: query
        description: Filter asset results by RSSI value
        style: form
        explode: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per page
        style: form
        explode: true
        schema:
          minimum: 0
          type: integer
          contentEncoding: int32
          default: 100
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      - name: duration
        in: query
        description: Time range duration for the query, using relative units such as `10m`, `7d`, or `2w`
        style: form
        explode: true
        schema:
          type: string
          default: 1d
          examples:
          - 10m
      - name: sort
        in: query
        description: On which field the list should be sorted, -prefix represents DESC order
        style: form
        explode: true
        schema:
          type: string
          default: timestamp
          examples:
          - -site_id
      - name: search_after
        in: query
        description: Pagination cursor for retrieving subsequent pages of results. This value is automatically populated by Mist in the `next` URL from the previous response and should not be manually constructed.
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_stats_assets'
                - description: Paginated response for asset statistics search results
                  examples:
                  - end: 0
                    limit: 0
                    next: string
                    results:
                    - battery_voltage: 0
                      eddystone_uid_instance: string
                      eddystone_uid_namespace: string
                      eddystone_url_url: string
                      ibeacon_major: 1
                      ibeacon_minor: 1
