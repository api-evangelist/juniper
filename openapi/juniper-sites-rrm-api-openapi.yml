paths:
  /api/v1/sites/{site_id}/rrm/channel_scores/band/{band}:
    parameters: []
    get:
      tags:
      - Sites RRM
      summary: getSiteChannelScores
      description: Get Site Channel Scores
      operationId: getSiteChannelScores
      parameters:
      - name: site_id
        in: path
        description: ''
        required: true
        schema:
          type: string
          contentEncoding: uuid
          examples:
          - 000000ab-00ab-00ab-00ab-0000000000ab
      - name: band
        in: path
        description: 802.11 Band
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/dot11_band'
          - description: 802.11 Band
      - name: start
        in: query
        description: Lower bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d` or `-1w`
        style: form
        explode: true
        schema:
          type: string
      - name: end
        in: query
        description: Upper bound of the time range, as an epoch timestamp in seconds or a relative value such as `-1d`, `-2h`, or `now`
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_rrm_channel_scores'
                - description: Response containing RRM channel score records
                  examples:
                  - results:
                    - channel: 36
                      util_score: 0.009
                      util_score_noise_floor: 0.001
                      util_score_non_wifi: 0.003
                      util_score_other: 0.002
                      util_score_radar: 0
                      util_score_undecodable_wifi: 0.004
                      util_score_unknown_wifi: 0
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    results:
                    - channel: 36
                      util_score: 0.009
                      util_score_noise_floor: 0.001
                      util_score_non_wifi: 0.003
                      util_score_other: 0.002
                      util_score_radar: 0
                      util_score_undecodable_wifi: 0.004
                      util_score_unknown_wifi: 0
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_rrm_channel_scores'
                - description: Response containing RRM channel score records
                  examples:
                  - results:
                    - channel: 36
                      util_score: 0.009
                      util_score_noise_floor: 0.001
                      util_score_non_wifi: 0.003
                      util_score_other: 0.002
                      util_score_radar: 0
                      util_score_undecodable_wifi: 0.004
                      util_score_unknown_wifi: 0
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
                    results:
                    - channel: 36
                      util_score: 0.009
                      util_score_noise_floor: 0.001
                      util_score_non_wifi: 0.003
                      util_score_other: 0.002
                      util_score_radar: 0
                      util_score_undecodable_wifi: 0.004
                      util_score_unknown_wifi: 0
        '400':
          description: Bad Syntax
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http400'
                - description: Standard HTTP 400 bad request error response
                  examples:
                  - detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http400'
                - description: Standard HTTP 400 bad request error response
                  examples:
                  - detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
                    detail: 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http401'
                - description: Standard HTTP 401 authentication error response
                  examples:
                  - detail: Authentication credentials were not provided.
                contentMediaType: application/json
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
            application/vnd.api+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/response_http401'
                - description: Standard HTTP 401 authentication error response
                  examples:
                  - detail: Authentication credentials were not provided.
                contentMediaType: application/vnd.api+json
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
        '403':
