      - any
      - critical
      - emergency
      - error
      - info
      - notice
      - warning
      type: string
      description: 'Syslog severity to match for this selector. enum: `alert`, `any`, `critical`, `emergency`, `error`, `info`, `notice`, `warning`.'
    snmp_config_engine_id_type2:
      title: snmp_config_engine_id_type2
      enum:
