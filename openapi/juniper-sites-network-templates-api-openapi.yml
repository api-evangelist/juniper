    vrf_config5:
      title: vrf_config5
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether to enable VRF (when supported on the device)
      description: VRF defaults applied by this network template
    snmp_vacm_security_to_group2:
      title: snmp_vacm_security_to_group2
