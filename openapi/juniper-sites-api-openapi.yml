components:
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 100
        maximum: 1000
    SiteId:
      name: site_id
      in: path
      required: true
      description: Site unique identifier
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
    OrgId:
      name: org_id
      in: path
      required: true
      description: Organization unique identifier
      schema:
        type: string
        format: uuid
  schemas:
    SiteStats:
      type: object
      properties:
        num_ap:
          type: integer
        num_ap_connected:
          type: integer
        num_switch:
          type: integer
        num_gateway:
          type: integer
        num_clients:
          type: integer
    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
          description: Timezone name (e.g., America/Los_Angeles)
        country_code:
          type: string
        latlng:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        sitegroup_ids:
          type: array
          items:
            type: string
            format: uuid
        rftemplate_id:
          type: string
          format: uuid
        created_time:
          type: number
        modified_time:
          type: number
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Error message
    response_http403:
      title: response_http403
      type: object
      properties:
        detail:
          type: string
          description: Human-readable explanation of the permission error
          examples:
          - You do not have permission to perform this action.
      description: Standard HTTP 403 permission error response
    site:
      title: site
      required:
      - name
      type: object
      properties:
        address:
          type:
          - string
          - 'null'
          description: full address of the site
          examples:
          - 1601 S. Deanza Blvd., Cupertino, CA, 95014
        alarmtemplate_id:
          type:
          - string
          - 'null'
          description: Alarm Template ID, this takes precedence over the Org-level alarmtemplate_id
          contentEncoding: uuid
          examples:
          - 684dfc5c-fe77-2290-eb1d-ef3d677fe168
        aptemplate_id:
          type:
          - string
          - 'null'
          description: AP Template ID, used by APs
          contentEncoding: uuid
          examples:
          - 16bdf952-ade2-4491-80b0-85ce506c760b
        country_code:
          type: string
          description: Country code for the site (for AP config generation), in two-character
          examples:
          - US
        created_time:
          type: number
          description: Timestamp when the site was created, in epoch seconds
          readOnly: true
        gatewaytemplate_id:
          type:
          - string
          - 'null'
          description: Gateway Template ID, used by gateways
          contentEncoding: uuid
          examples:
          - 6f9b2e75-9b2f-b5ae-81e3-e14c76f1a90f
        id:
          type: string
          description: Unique value identifying the site
          contentEncoding: uuid
          readOnly: true
          examples:
          - 53f10664-3ce8-4c27-b382-0ef66432349f
        latlng:
          allOf:
          - $ref: '#/components/schemas/lat_lng2'
          - description: Latitude and longitude for the site location
        modified_time:
          type: number
          description: Timestamp when the site was last modified, in epoch seconds
          readOnly: true
        name:
          type: string
          description: Display name of the site
          examples:
          - Mist Office
        networktemplate_id:
          type:
          - string
          - 'null'
          description: Network Template ID, this takes precedence over Site Settings
          contentEncoding: uuid
          examples:
          - 12ae9bd2-e0ab-107b-72e8-a7a005565ec2
        notes:
          type:
          - string
          - 'null'
          description: Optional, any notes about the site
        org_id:
          type: string
          description: Organization identifier associated with the site
          contentEncoding: uuid
          readOnly: true
          examples:
          - a97c1b22-a4e9-411e-9bfd-d8695a0f9e61
        rftemplate_id:
          type:
          - string
          - 'null'
          description: RF Template ID, this takes precedence over Site Settings
          contentEncoding: uuid
          examples:
          - bb8a9017-1e36-5d6c-6f2b-551abe8a76a2
        routertemplate_id:
          type:
          - string
          - 'null'
          description: Router Template ID, used by gateways
          contentEncoding: uuid
          examples:
          - 6f9b2e75-9b2f-b5ae-81e3-e14c76f1a90f
        secpolicy_id:
          type:
          - string
          - 'null'
          description: Security policy identifier applied to this site
          contentEncoding: uuid
          examples:
          - 3bcd0beb-5d0a-4cbd-92c1-14aea91e98ef
        sitegroup_ids:
          type: array
          items:
            type: string
            contentEncoding: uuid
          description: Site group identifiers for groups that include this site
        sitetemplate_id:
          type:
          - string
          - 'null'
          description: Site template identifier applied to this site
          contentEncoding: uuid
        timezone:
          type: string
          description: IANA time zone name for the site
          default: UTC
          examples:
          - America/Los_Angeles
        tzoffset:
          type: integer
          description: Time zone offset value derived from the site's timezone
          contentEncoding: int32
          default: 0
      description: Site configuration and metadata within an organization
    response_http401:
      title: response_http401
      type: object
      properties:
        detail:
          type: string
          description: Human-readable explanation of the authentication error
          examples:
          - Authentication credentials were not provided.
      description: Standard HTTP 401 authentication error response
    response_http429:
      title: response_http429
      type: object
      properties:
        detail:
          type: string
          description: Human-readable explanation of the rate limit error
          examples:
          - Too Many Request. The API Token used for the request reached the 5000 API Calls per hour threshold
      description: Standard HTTP 429 rate limit error response
    response_http404:
      title: response_http404
      type: object
      properties:
        id:
          type: string
          description: Missing resource identifier, when the API includes one
      description: Standard HTTP 404 not found error response
    lat_lng2:
      title: lat_lng2
      required:
      - lat
      - lng
      type: object
      properties:
        lat:
          type: number
          description: Geographic latitude in decimal degrees
          examples:
          - 37.295833
        lng:
          type: number
          description: Geographic longitude in decimal degrees
          examples:
          - -122.032946
      description: Latitude and longitude for the site location
    response_http400:
      title: response_http400
      type: object
      properties:
        detail:
          type: string
          description: Human-readable explanation of the bad request error
          examples:
          - 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
      description: Standard HTTP 400 bad request error response
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: 'API token authentication. Obtain tokens from the Mist dashboard under Organization > Settings > API Token, or via the /self/apitokens endpoint. Pass as Authorization: Token <api-token>.'
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: CSRF token for session-based authentication.
