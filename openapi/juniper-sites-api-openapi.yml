openapi: 3.2.0
info:
  title: Juniper Sites API
  version: '1.0'
  description: 'Operations tagged Sites across 2 of this provider''s published API definitions: juniper-mist-openapi.yml, juniper-sites-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.mist.com/api/v1
  description: Global Cloud (US)
- url: https://api.eu.mist.com/api/v1
  description: EU Cloud
- url: https://api.gc1.mist.com/api/v1
  description: GovCloud
- url: https://api.mist.com
  variables: {}
- url: https://api.gc1.mist.com
  variables: {}
- url: https://api.ac2.mist.com
  variables: {}
- url: https://api.gc2.mist.com
  variables: {}
- url: https://api.gc4.mist.com
  variables: {}
- url: https://api.eu.mist.com
  variables: {}
- url: https://api.gc3.mist.com
  variables: {}
- url: https://api.ac6.mist.com
  variables: {}
- url: https://api.gc6.mist.com
  variables: {}
- url: https://api.ac5.mist.com
  variables: {}
- url: https://api.gc5.mist.com
  variables: {}
- url: https://api.gc7.mist.com
  variables: {}
security:
- apiToken: []
- csrfToken: []
tags:
- name: Sites
  description: Site-level management
paths:
  /orgs/{org_id}/sites:
    get:
      operationId: listOrgSites
      summary: Juniper Networks List sites in organization
      description: Returns a list of all sites belonging to the specified organization.
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
    post:
      operationId: createSite
      summary: Juniper Networks Create a site
      description: Creates a new site within the specified organization.
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
      responses:
        '200':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
    servers:
    - url: https://api.mist.com/api/v1
      description: Global Cloud (US)
    - url: https://api.eu.mist.com/api/v1
      description: EU Cloud
    - url: https://api.gc1.mist.com/api/v1
      description: GovCloud
  /sites/{site_id}:
    get:
      operationId: getSite
      summary: Juniper Networks Get site details
      description: Returns details for a specific site.
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateSite
      summary: Juniper Networks Update site
      description: Updates an existing site.
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Site'
      responses:
        '200':
          description: Site updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    delete:
      operationId: deleteSite
      summary: Juniper Networks Delete site
      description: Deletes a site from the organization.
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site deleted
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://api.mist.com/api/v1
      description: Global Cloud (US)
    - url: https://api.eu.mist.com/api/v1
      description: EU Cloud
    - url: https://api.gc1.mist.com/api/v1
      description: GovCloud
  /sites/{site_id}/stats:
    get:
      operationId: getSiteStats
      summary: Juniper Networks Get site statistics
      description: Returns statistics for a specific site.
      tags:
      - Sites
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteStats'
    servers:
    - url: https://api.mist.com/api/v1
      description: Global Cloud (US)
    - url: https://api.eu.mist.com/api/v1
      description: EU Cloud
    - url: https://api.gc1.mist.com/api/v1
      description: GovCloud
