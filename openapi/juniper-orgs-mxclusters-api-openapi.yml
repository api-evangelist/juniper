    mxcluster_radsec_auth_server:
      title: mxcluster_radsec_auth_server
      type: object
      properties:
        host:
          type: string
          description: IP / hostname of RADIUS server
        inband_status_check:
          type: boolean
          description: Whether to enable inband status check
          default: false
        inband_status_interval:
          minimum: 0
