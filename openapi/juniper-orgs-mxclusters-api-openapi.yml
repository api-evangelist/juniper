          allOf:
          - $ref: '#/components/schemas/tunterm_dhcpd_type1'
          - description: 'DHCP forwarding mode for this tunneled VLAN. enum: `relay`.'
      description: Per-VLAN DHCP relay configuration for tunnel termination
