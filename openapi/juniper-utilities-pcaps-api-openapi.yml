    post:
      tags:
      - Utilities PCAPs
      summary: startSitePacketCapture
      description: 'Initiate a Site Packet Capture


        The output will be available through websocket. As there can be multiple commands issued against the same AP at the same time and the output all goes through the same websocket stream, session is introduced for demux.


        #### Subscribe to Device Command outputs

        `WS /api-ws/v1/stream`


        ```json

        {

        "subscribe": "/sites/{site_id}/pcaps"

        }

        ```

        #### Response (MxEdge)

        ```json

        {

        "event": "data"

        "channel": "/sites/{site_id}/pcaps"

        "data": {

        "capture_id": "6b1be4fb-b239-44d9-9d3b-cb1ff3af1721",

        "lost_messages": 0

        "pcap_dict": {

        "channel_frequency": 2412,

        "channel": "1",

        "datarate": "1.0 Mbps",

        "rssi": -75,

        "dst": "78:bd:bc:ca:0b:0a",

