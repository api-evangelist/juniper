        max_pkt_len:
          maximum: 2048
          minimum: 64
          type:
          - integer
          - 'null'
          description: Maximum number of bytes captured from each packet
          contentEncoding: int32
          default: 512
          examples:
          - 128
        num_packets:
          maximum: 10000
          minimum: 0
