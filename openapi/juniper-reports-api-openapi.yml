openapi: 3.2.0
info:
  title: Juniper Networks Juniper Advanced Threat Prevention (ATP) Cloud Reports API
  description: Juniper Advanced Threat Prevention (ATP) Cloud API provides access to threat intelligence, malware analysis, and security event management. The API enables querying threat feeds, submitting files for analysis, retrieving detection verdicts, managing allow/block lists, and accessing threat intelligence data for integration with SRX Series firewalls and other security infrastructure.
  version: 1.0.0
  contact:
    name: Juniper Support
    url: https://www.juniper.net/us/en/products/security/advanced-threat-prevention.html
    email: support@juniper.net
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{atp_server}/api/v1
  description: ATP Cloud Server
  variables:
    atp_server:
      default: atp.juniper.net
      description: ATP Cloud server hostname
security:
- apiKey: []
tags:
- name: Reports
  description: Threat and activity reports
paths:
  /reports/threats:
    get:
      operationId: getThreatReport
      summary: Juniper Networks Get threat report
      description: Returns a summary report of threats detected over a time period.
      tags:
      - Reports
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Threat report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatReport'
components:
  schemas:
    ThreatReport:
      type: object
      properties:
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        summary:
          type: object
          properties:
            total_threats:
              type: integer
            malware_detected:
              type: integer
            c2_connections_blocked:
              type: integer
            phishing_blocked:
              type: integer
        top_threats:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              category:
                type: string
              count:
                type: integer
              severity:
                type: string
        top_targeted_hosts:
          type: array
          items:
            type: object
            properties:
              hostname:
                type: string
              ip:
                type: string
              threat_count:
                type: integer
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: API token obtained from the login endpoint
externalDocs:
  description: ATP Cloud Documentation
  url: https://www.juniper.net/documentation/us/en/software/atp/
