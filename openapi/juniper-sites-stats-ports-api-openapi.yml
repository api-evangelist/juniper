          description: LTE IMSI value, Check for null/empty
        mac:
          type: string
          description: Switch MAC address that reported these port statistics
          readOnly: true
          examples:
          - 5c4527a96580
        mac_count:
          type: integer
          description: Number of MAC addresses in the forwarding table
          contentEncoding: int32
          readOnly: true
        mac_limit:
