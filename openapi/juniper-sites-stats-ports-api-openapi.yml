        port_id:
          type: string
          description: Identifier of the port reporting these statistics
          readOnly: true
          examples:
          - ge-0/0/0
        port_mac:
          type: string
          description: MAC address assigned to the interface
          readOnly: true
          examples:
          - 5c4527a96580
        port_usage:
          type: string
          description: Logical usage assigned to the port
          examples:
          - lan
        power_draw:
