        rx_errors:
          type: integer
          description: Number of receive errors observed on the interface
          contentEncoding: int32
          readOnly: true
        rx_mcast_pkts:
          type: integer
          description: Number of multicast packets received on the interface
          contentEncoding: int32
          readOnly: true
        rx_pkts:
          type:
          - integer
          - 'null'
          description: Total packets received on the port
