      - aes_gcm128
      - aes_gcm256
      type: string
      description: 'Cipher algorithm used by this IPsec proposal. enum: `3des`, `aes128`, `aes256`, `aes_gcm128`, `aes_gcm256`.'
    gw_routing_policy_term_matching_route_exists2:
      title: gw_routing_policy_term_matching_route_exists2
